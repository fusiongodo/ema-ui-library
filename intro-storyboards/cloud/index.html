<title>The Cloud</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --page:#EEF0F4; --ink:#1A2233; --muted:#5B6578; --accent:#A8731A;
  --btn:#FFFFFF; --btnline:#D3D8E2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#05070D; --ink:#E6E9F0; --muted:#8C95A8; --accent:#FFD27A;
    --btn:#121826; --btnline:#263045;
  }
}
:root[data-theme="dark"]{
  --page:#05070D; --ink:#E6E9F0; --muted:#8C95A8; --accent:#FFD27A;
  --btn:#121826; --btnline:#263045;
}
html,body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;}
body{overflow-x:hidden}
.wrap{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  padding:12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));}
.col{width:min(430px, 100%, calc((100vh - 96px) * 390 / 844));}
@supports (height:100dvh){ .col{width:min(430px, 100%, calc((100dvh - 96px) * 390 / 844));} }
.stage{position:relative;width:100%;aspect-ratio:390/844;border-radius:28px;overflow:hidden;background:#0B1120;
  cursor:pointer;-webkit-tap-highlight-color:transparent;}
.stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.word{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);color:#FFF1C9;font-weight:700;
  letter-spacing:.03em;opacity:0;pointer-events:none;white-space:nowrap;line-height:1;font-size:35px}
.bar{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px}
.bar input{flex:1;min-width:0;margin:0;accent-color:var(--accent)}
.scrubw{flex:1;min-width:0;display:flex;align-items:center;position:relative}
.scrubw input{width:100%}
.marks{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none;--th:8px}
.mark{position:absolute;bottom:0;transform:translateX(-50%);font-size:10px;line-height:10px;color:var(--muted);
  text-align:center;pointer-events:none;font-variant-numeric:tabular-nums}
.mark::after{content:"";display:block;width:1px;height:3px;margin:1px auto 0;background:currentColor}
.keys{display:none}
.btn{font:inherit;font-size:12px;color:var(--ink);background:var(--btn);border:1px solid var(--btnline);
  border-radius:999px;height:28px;padding:0 12px;cursor:pointer;white-space:nowrap}
.btn.icon{width:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.btn.speed{height:32px;min-width:44px;padding:0 8px;font-variant-numeric:tabular-nums}
.btn.speed.on{color:var(--accent);border-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;min-width:38px;text-align:right;color:var(--muted)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);min-height:28px}
.again[hidden]{display:none}
.stage:focus{outline:none}
.panel{margin-top:14px;font-size:12px;color:var(--ink)}
.panel summary{cursor:pointer;font-weight:600;padding:6px 0;color:var(--muted)}
.psec + .psec{border-top:1px solid var(--btnline);margin-top:12px;padding-top:10px}
.phead{display:flex;align-items:baseline;gap:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.phead .ptime{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr auto 32px;align-items:center;column-gap:6px;margin-top:6px}
.prow label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .val{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.prow input{grid-column:1 / 3;width:100%;min-width:0;height:32px;margin:0;accent-color:var(--accent)}
.prow .rs{grid-column:3;grid-row:1 / 3;width:32px;height:32px;padding:0}
.pbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pbtns .btn{height:32px}
/* wide windows: sliders to the right of the film, the page itself never scrolls; the panel scrolls inside if needed */
@media (min-width: 820px){
  .wrap{padding-top:8px;padding-bottom:8px;}
  .col{width:auto;display:grid;column-gap:24px;align-items:start;
    grid-template-columns:min(430px, calc((100vh - 96px) * 390 / 844)) clamp(340px, 30vw, 420px);}
  .col > .stage, .col > .bar, .col > .row2{grid-column:1;}
  .side{grid-column:2;grid-row:1 / 4;align-self:stretch;position:relative;}
  .panel{position:absolute;left:0;right:0;top:0;max-height:100%;overflow-y:auto;margin-top:0;padding-right:6px;box-sizing:border-box;}
  .panel summary{padding-top:0;}
  .prow{margin-top:4px;}
  .prow input{height:24px;}
  .prow .rs{width:28px;height:28px;}
  .pfoot{position:sticky;bottom:0;background:var(--page);padding-top:8px;}
  .pfoot .pbtns{margin-top:0;}
  .keys{display:block;margin-top:6px;font-size:11px;color:var(--muted)}
}
@supports (height:100dvh){ @media (min-width: 820px){
  .col{grid-template-columns:min(430px, calc((100dvh - 96px) * 390 / 844)) clamp(340px, 30vw, 420px);}
} }
.pnote{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.plan{--pl:44px;margin-top:10px;background:#0B1120;border-radius:8px;padding:9px 8px 5px;font-size:10px;line-height:10px;color:#8C95A8}
.pbody{position:relative}
.prow2{display:grid;grid-template-columns:var(--pl) 1fr;align-items:center;height:10px;margin-bottom:8px;position:relative}
.plab{white-space:nowrap}
.pbar{position:absolute;top:0;height:10px;border-radius:2px}
.pbar-rise{background:rgba(110,140,195,0.55)}
.pbar-top{background:rgba(255,241,201,0.85)}
.pbar-stream{background:rgba(226,196,120,0.45)}
.pbar-cam{background:rgba(160,166,178,0.40)}
.pck{grid-column:auto !important;width:14px !important;height:14px !important;margin:0 !important;flex:none;accent-color:var(--accent)}
.plabw{display:flex;align-items:center;gap:6px;min-width:0}
.plabw label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcouple{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:6px;line-height:1.35}
.pcouple span{flex:1;min-width:0}
.ptbtn{font:inherit;font-size:11px;background:none;border:0;padding:2px 4px;color:var(--accent);cursor:pointer;text-decoration:underline;flex:none}
.pbar-fall{background:rgba(150,178,225,0.75)}
.pbar-fall2{background:rgba(150,178,225,0.375)}
.plegend{margin-top:3px;font-size:10px;line-height:12px;color:#8C95A8;display:flex;flex-wrap:wrap;align-items:center;column-gap:6px;row-gap:2px}
.plegend i{display:inline-block;vertical-align:middle;margin-right:4px}
.plg-band{width:10px;height:8px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.28);border-radius:2px;box-sizing:border-box}
.plg-head{width:1px;height:10px;background:rgba(255,255,255,0.7)}
.phint{font-size:10px;color:var(--muted);line-height:1.3;margin-top:2px}
.pband{position:absolute;top:-4px;bottom:0;background:rgba(255,255,255,0.10);border-radius:2px;pointer-events:none}
.phead2{position:absolute;top:-4px;bottom:0;width:1px;background:rgba(255,255,255,0.7);pointer-events:none}
.paxis{position:relative;height:14px;margin-left:var(--pl)}
.paxis span{position:absolute;top:2px;transform:translateX(-50%)}
.ptext{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.35}
.pline{margin-top:8px;padding:8px;border:1px solid var(--btnline);border-radius:8px;background:var(--btn);
  font-family:ui-monospace,Menlo,monospace;font-size:11px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
</style>

<div class="wrap">
  <div class="col">
    <div class="stage" id="stage" tabindex="-1" aria-label="Intro-Animation, tippen startet neu">
      <div class="word" id="word">MEjority</div>
    </div>
    <div class="bar">
      <button class="btn icon" id="play" aria-label="Abspielen">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path id="playIcon" fill="currentColor" d="M2 1l9 5-9 5z"/></svg>
      </button>
      <button class="btn speed" id="speed" aria-label="Geschwindigkeit 1&times;">1&times;</button>
      <span class="scrubw"><input type="range" id="scrub" min="0" max="13.8" step="0.01" value="0" aria-label="Zeit"><span class="marks" id="marks" aria-hidden="true"></span></span>
      <span class="time" id="time">0.0 s</span>
    </div>
    <div class="row2">
      <span id="step">Ein Stern</span>
      <button class="btn again" id="again" hidden>Noch mal</button>
    </div>
    <div class="side">
    <details class="panel" id="panel" open>
      <summary>Regler</summary>
      <div id="prows"></div>
      <div class="pfoot">
      <div class="pbtns">
        <button class="btn" id="pReset">Alle zur&uuml;cksetzen</button>
        <button class="btn" id="pCopy">Werte kopieren</button>
      </div>
      <div class="pline" id="pLine">alles Standard</div>
      <div class="keys">Leertaste Play/Pause &middot; Pfeile 0,1 s &middot; Shift+1 bis 9 Marke setzen &middot; 1 bis 9 springen</div>
      </div>
    </details>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
// ---------------------------------------------------------------- constants
// TB = the moment the first broadcast signal left the centre in the earlier versions; SHIFT stays 0 (one version).
var TB = 5.50, SHIFT = 0;
var T_END = 13.8;   // set below
var N = 600;
var R = 10;
var ASPECT = 390 / 844;
var DEG = Math.PI / 180;
var OMEGA_OUT = 2 * Math.PI / 22;
var TILT = 62 * DEG;          // main plane: normal 62 deg away from the line of sight
var W0 = 0.45;                // visible half-width (world) at t = 0: the hero alone
var W_END = 11.5;             // visible half-width from 6.0 s on: cloud + small margin
var H_W = 2 * W_END / ASPECT; // stage height in world units in chart space

var COL_WARM = hex('#FFD27A'), COL_CHARGED = hex('#FFF1C9'),
    COL_BLUE = hex('#8FA3C4');
var BG = hex('#0B1120');

var STEPS = [
  [0.0,'Ein Stern'],[1.5,'Mehr und mehr'],[3.3,'Einige geben']
];  // the later steps are appended once the rain / ring times are known (see T_FALL0, R0)

function hex(h){ var n = parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; }
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
function seg(t,a,b){ return clamp01((t-a)/(b-a)); }
function lerp(a,b,u){ return a + (b-a)*u; }
function eIn(x){ return x*x*x; }
function eOut(x){ var y = 1-x; return 1 - y*y*y; }
function eIO(x){ return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; }
function eInQuart(x){ return x*x*x*x; }
function ss(x){ x = clamp01(x); return x*x*x*(x*(6*x - 15) + 10); }   // smootherstep
function ssI(x){ x = clamp01(x); return x*x*x*x*(x*(x - 3) + 2.5); } // integral of ss over 0..x

// seeded random (mulberry32)
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rand = rng(20261119);
function gauss(){ var u = Math.max(1e-9, rand()), v = rand(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }

// ---------------------------------------------------------------- stars
var S = [];
for (var i = 0; i < N; i++){
  var r = Math.max(1.5, R * Math.sqrt(rand()));
  if (i === 0) r = 6;
  var node = rand() * 2 * Math.PI, inc = (rand()*2 - 1) * 35 * DEG;
  if (i === 0) inc = 6 * DEG;
  var ux = Math.cos(node), uy = Math.sin(node);
  // v = in-plane perpendicular, tilted about u by inc
  var vx = -Math.sin(node) * Math.cos(inc), vy = Math.cos(node) * Math.cos(inc), vz = Math.sin(inc);
  S.push({
    r: r, ux: ux, uy: uy, vx: vx, vy: vy, vz: vz,
    ph: rand() * 2 * Math.PI,
    om: OMEGA_OUT * Math.pow(R / r, 0.5),
    size: 11 * (1 + (rand()*2 - 1) * 0.4),
    bright: i === 0 ? 0.85 : 0.6 + rand() * 0.3,
    twP: 1.5 + rand() * 1.5, twPh: rand() * 2 * Math.PI
  });
}

// orbit angle = integral of the spin rate; rate: 0 -> 1 (smootherstep 2.8..5.6: the turn is complete before the
// giving), 1 -> 0 (smootherstep 7.2..8.9, while the stars already rise: they spiral upward, the last turn dies as
// the last stars reach the line). SPIN_DIR: the cloud's own turn matches the apparent turn from the camera moving right.
var SPIN_DIR = -1, SPIN_T1 = 7.2 + SHIFT, SPIN_T2 = 8.9 + SHIFT, SP0 = 2.8, SP1 = 5.6;
function spinA(t){
  var U = SP1 - SP0, D = SPIN_T2 - SPIN_T1;
  var up = t <= SP0 ? 0 : t < SP1 ? U * ssI((t - SP0) / U) : U / 2 + (t - SP1);
  var dn = t <= SPIN_T1 ? 0 : t < SPIN_T2 ? D * ssI((t - SPIN_T1) / D) : D / 2 + (t - SPIN_T2);
  return SPIN_DIR * (up - dn);
}
// depth of the cloud along the view axis: flat until 2.8, full by 5.3
function depthS(t){ return eIO(seg(t, 2.8, 5.3)); }

var cT = Math.cos(TILT), sT = Math.sin(TILT);
function cloudPos(i, A, dz, out){
  var s = S[i], th = s.ph + s.om * A, c = Math.cos(th), sn = Math.sin(th);
  var x = s.r * (s.ux*c + s.vx*sn), y = s.r * (s.uy*c + s.vy*sn), z = s.r * (s.vz*sn);
  // rotate the face-on disc about X so its top leans away: normal = (0, sin62, cos62)
  out[0] = x;
  out[1] = y * cT + z * sT;
  out[2] = (-y * sT + z * cT) * dz;
  return out;
}

// ---------------------------------------------------------------- camera
// W(t): one eased curve in log space, 0.6 .. 6.0
function camW(t){ return W0 * Math.pow(W_END / W0, eIO(seg(t, 0.6, 6.0))); }
// the switch: one smootherstep over 6.20..8.2 for angles, fov and depth (starts with the first rise)
var SW_T1 = 6.20 + SHIFT, SW_T2 = 8.2 + SHIFT;
function swU(t){ return ss(seg(t, SW_T1, SW_T2)); }
function camFov(t){
  var pre = 8 + 34 * eIO(seg(t, 2.8, 5.3));
  if (t < SW_T1) return pre;
  return pre - (pre - 6) * swU(t);            // = 42 - 36 u once the pre-curve stands at 42 (start >= 5.3)
}
function camAngles(t){
  var d = ss(seg(t, 2.6, 6.0)), b = swU(t);
  return [28 * DEG * d * (1-b), 8 * DEG * d * (1-b)];
}
function camDepth(t){ return t < SW_T1 ? depthS(t) : depthS(t) * (1 - swU(t)); }   // = 1 - u once depthS is 1
// timetable slider "Kamera kippt ab": shifts the switch and the spin-down together (durations kept)
function hitLastEff(){ return P.hitLast === LH1_ ? LH1_ + (P.streamShift - 4.20) : P.hitLast; }
function camSet(){ var c = P.camStart - 6.20; SW_T1 = 6.20 + SHIFT + c; SW_T2 = 8.2 + SHIFT + c; SPIN_T1 = 7.2 + SHIFT + c; SPIN_T2 = 8.9 + SHIFT + c; }
var tmp = [0,0,0], tmp2 = [0,0,0];
function camTarget(t, out){
  cloudPos(0, spinA(t), depthS(t), out);
  var u = eIO(seg(t, 1.5, 4.5));
  out[0] *= 1-u; out[1] *= 1-u; out[2] *= 1-u;
  return out;
}

// ---------------------------------------------------------------- fade-in schedule (step 2)
var WTAB = []; for (var k = 0; k <= 600; k++) WTAB.push(camW(k * 0.01));
function camWinv(w){ for (var k = 0; k <= 600; k++) if (WTAB[k] >= w) return k * 0.01; return 6; }
var hero0 = cloudPos(0, 0, 0, [0,0,0]), p0 = [0,0,0], dmax = 0;
for (i = 0; i < N; i++){ cloudPos(i, 0, 0, p0); S[i].dh = Math.hypot(p0[0]-hero0[0], (p0[1]-hero0[1]) * ASPECT * 1.6); dmax = Math.max(dmax, S[i].dh); }
for (i = 1; i < N; i++){
  // first the hero's neighbours as the frame widens, then a wave running outward from the hero; all lit by 4.5
  var st = Math.min(camWinv(S[i].dh * 1.15), 2.5 + 1.4 * S[i].dh / dmax) + rand() * 0.12;
  S[i].fade = Math.max(1.2, Math.min(4.0, st));   // the hero is alone a little longer
}

// ---------------------------------------------------------------- givers (step 4)
var GIVE_GAP = 0.88 / 7, GIVE_T0 = 2.9, SPARK_DUR = 0.5;   // package travel 0.5 s
var givers = [0], givers0 = [0];
var HERO_B = 1.15 * (function(){ var m = 0; for (var j = 1; j < N; j++) m = Math.max(m, S[j].bright); return m; })();
// camera at time t (shared by render and the giver check)
function setCam(t, cam){
  var W = camW(t), fov = camFov(t), ang = camAngles(t);
  var dist = W / (Math.tan(fov/2*DEG) * ASPECT);
  camTarget(t, tmp);
  cam.fov = fov; cam.updateProjectionMatrix();
  cam.position.set(tmp[0] + dist*Math.sin(ang[0])*Math.cos(ang[1]),
                   tmp[1] + dist*Math.sin(ang[1]),
                   tmp[2] + dist*Math.cos(ang[0])*Math.cos(ang[1]));
  cam.lookAt(tmp[0], tmp[1], tmp[2]);
  cam.updateMatrixWorld(); cam.matrixWorldInverse.copy(cam.matrixWorld).invert();
  return dist;
}
var chkCam = new THREE.PerspectiveCamera(8, ASPECT, 0.05, 5000), chkV = new THREE.Vector3();
function onScreen(j, t, lim){   // live cloud position at t (stars orbit until the rise)
  cloudPos(j, spinA(t), depthS(t), p0);
  setCam(t, chkCam);
  chkV.set(p0[0], p0[1], p0[2]).project(chkCam);
  return chkV.z < 1 && Math.abs(chkV.x) <= lim && Math.abs(chkV.y) <= lim;
}
(function(){
  var sectors = [0,1,2,3,4,5,6,7];
  for (var a = 7; a > 0; a--){ var b = Math.floor(rand()*(a+1)), tt = sectors[a]; sectors[a] = sectors[b]; sectors[b] = tt; }
  var heroAng = Math.atan2(hero0[1], hero0[0]);
  sectors.forEach(function(sec){
    var cand = [];
    for (var j = 1; j < N; j++){
      if (S[j].r < 4 || S[j].r > 9.5) continue;
      cloudPos(j, 0, 1, p0);
      var ang = Math.atan2(p0[1], p0[0]) - heroAng;
      ang = ((ang % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
      if (Math.floor(ang / (Math.PI/4)) === sec && (sec !== 0 || ang > 0.3)) cand.push(j);
    }
    // same random draw as before; if that star is not lit or not inside the frame (5 % margin) at its give time,
    // take the next candidate of the sector that is (deterministic)
    var k0 = Math.floor(rand() * cand.length), tg = GIVE_T0 + givers.length * GIVE_GAP, pick = cand[k0];
    givers0.push(pick);
    givers.push(pick);   // the list stays as approved (0, 144, 67, 351, 301, 273, 344, 322, 107); no fallback
  });
})();
// the dialogue: gives from 3.30 to TB - 0.75 (18 in A, 12 in B), gaps shrinking linearly (first : last = 2.5 : 1);
// the last package arrives at TB - 0.25. The choice is deterministic and draws no random numbers (nothing else shifts).
var GIVE_N = 18, GIVE_FIRST = 3.30, GIVE_SPAN = TB - 0.75 - 3.30, GIVE_MARGIN = 0.9, GIVE_MIN_R = 0.35 * R;
var GIVE_T = [GIVE_FIRST], GIVE_LOG = [], GIVE_RELAXED = 0;
(function(){
  var gs = [], sum = 0, k;
  for (k = 0; k < GIVE_N - 1; k++){ gs.push(2.5 + (1 - 2.5) * k / (GIVE_N - 2)); sum += gs[k]; }
  for (k = 0; k < GIVE_N - 1; k++) GIVE_T.push(GIVE_T[k] + gs[k] * GIVE_SPAN / sum);
  GIVE_T[GIVE_N - 1] = GIVE_FIRST + GIVE_SPAN;
  // in frame (5 % margin) from the give until the package has arrived; screen direction seen from the centre
  function inFrame(j, t0){ for (var u = 0; u <= 10; u++) if (!onScreen(j, t0 + SPARK_DUR * u / 10, GIVE_MARGIN)) return false; return true; }
  function dirAt(j, t){
    setCam(t, chkCam);
    chkV.set(0, 0, 0).project(chkCam); var cx = chkV.x, cy = chkV.y;
    cloudPos(j, spinA(t), depthS(t), p0); chkV.set(p0[0], p0[1], p0[2]).project(chkCam);
    return Math.atan2((chkV.y - cy) / ASPECT, chkV.x - cx);
  }
  function turn(a, b){ var d = Math.abs(a - b) % (2*Math.PI); return d > Math.PI ? 2*Math.PI - d : d; }
  var oldG = givers.slice(1), slot = [], used = {}; used[0] = true;
  // in time order. Rules: not the hero, nobody twice, in frame, at least 35 % of the cloud radius from the centre,
  // a turn of 70..150 deg from the previous giver. Preferred: one of the eight earlier givers (+2), at least 40 deg
  // from the giver two before (+1); ties by a fixed hash of the star index.

window.__cloud.riseInfo = function(){ return { up: RC.up, v: RC.v, k: RC.k, accEff: RC.accEff, vEff: RC.vEff,
  clamped: !RC.def && (Math.abs(RC.accEff - P.riseAcc) > 0.005 || Math.abs(RC.vEff - P.riseVmax) > 0.005) }; };

playBtn.addEventListener('click', function(){ playing ? pause() : play(); });
speedBtn.addEventListener('click', function(){
  speedK = (speedK + 1) % SPEEDS.length; speed = SPEEDS[speedK];
  if (playing) anchor();
  var lab = String(speed) + '\u00D7';
  speedBtn.textContent = lab; speedBtn.setAttribute('aria-label', 'Geschwindigkeit ' + lab);
  speedBtn.classList.toggle('on', speed !== 1);
});
Object.defineProperty(window.__cloud, 'speed', { get: function(){ return speed; } });
again.addEventListener('click', function(){ play(0); });
stage.addEventListener('click', function(){ play(0); });
// marks 1..9 on the timeline: Shift + digit sets (or removes, within 0.02 s), digit jumps. Stored per viewer.
var MKEY = 'cloud.marks.v1', marks = {}, marksEl = document.getElementById('marks');
try { var mSaved = JSON.parse(localStorage.getItem(MKEY) || 'null'); if (mSaved && typeof mSaved === 'object') for (var mk0 in mSaved) if (/^[1-9]$/.test(mk0) && isFinite(+mSaved[mk0])) marks[mk0] = Math.max(0, Math.min(T_END, +mSaved[mk0])); } catch (er) {}
function marksSave(){ try { localStorage.setItem(MKEY, JSON.stringify(marks)); } catch (er) {} }
function marksDraw(){
  marksEl.textContent = '';
  Object.keys(marks).sort().forEach(function(k){
    var m = document.createElement('span'); m.className = 'mark'; m.textContent = k; m.dataset.t = String(marks[k]);
    var fr = Math.min(marks[k], T_END) / T_END;   // marks behind a shorter film stay stored, shown at the end
    m.style.left = 'calc(var(--th) + (100% - 2 * var(--th)) * ' + fr.toFixed(5) + ')';
    marksEl.appendChild(m);
  });
}
var markMsg = '', markMsgUntil = 0, markTimer = 0;
function markNote(txt){ markMsg = txt; markMsgUntil = performance.now() + 1000; ui(); clearTimeout(markTimer); markTimer = setTimeout(ui, 1010); }
marksDraw();
window.__cloud.marks = function(){ var o = {}; for (var k in marks) o[k] = marks[k]; return o; };
// time slider: dragging or clicking keeps the play state (playing resumes from the new position on release)
var scrubResume = false;
function scrubStart(){ if (playing){ scrubResume = true; pause(); } }
function scrubEnd(){ if (scrubResume){ scrubResume = false; play(); } }
scrub.addEventListener('pointerdown', scrubStart);
scrub.addEventListener('input', function(){ scrubStart(); seek(parseFloat(scrub.value)); });
scrub.addEventListener('change', scrubEnd);
scrub.addEventListener('pointerup', scrubEnd);
scrub.addEventListener('pointercancel', scrubEnd);
// keyboard: space toggles play / pause wherever the focus is (once per press: the focused control does not also act,
// the page does not scroll); arrows step the film 0.1 s (Shift: 1.0 s) and pause, except on a parameter slider
function isParamSlider(el){ return el && el.tagName === 'INPUT' && el.type === 'range' && el.id.indexOf('p_') === 0; }
document.addEventListener('keydown', function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space' || e.key === ' '){
    e.preventDefault(); e.stopPropagation();
    if (!e.repeat){ if (playing) pause(); else play(); }
    return;
  }
  var dm_ = /^(Digit|Numpad)([1-9])$/.exec(e.code || '');
  if (dm_){
    e.preventDefault(); e.stopPropagation();
    if (e.repeat) return;
    var mk = dm_[2];
    if (e.shiftKey){
      if (dm_[1] !== 'Digit') return;
      if (marks[mk] !== undefined && Math.abs(marks[mk] - cur) <= 0.02){ delete marks[mk]; markNote('Marke ' + mk + ' entfernt'); }
      else { marks[mk] = cur; markNote('Marke ' + mk + ' \u00b7 ' + cur.toFixed(2) + ' s'); }
      marksSave(); marksDraw();
    } else if (marks[mk] !== undefined) seek(marks[mk]);   // play state kept (seek re-anchors while playing)
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    if (isParamSlider(e.target)) return;
    e.preventDefault(); e.stopPropagation();
    var stepT = (e.shiftKey ? 1.0 : 0.1) * (e.key === 'ArrowRight' ? 1 : -1);
    pause(); seek(Math.round((cur + stepT) * 1000) / 1000);
  }
}, true);
document.addEventListener('keyup', function(e){ if (e.code === 'Space' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); } }, true);
// inside the artifact frame keys only arrive once the document has focus: a press on the stage or the player gives it
stage.addEventListener('pointerdown', function(){ try { stage.focus({ preventScroll: true }); } catch (er) { stage.focus(); } });
document.addEventListener('pointerdown', function(){ try { window.focus(); } catch (er) {} }, true);
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ resumeOnShow = playing; if (playing) pause(); }
  else if (resumeOnShow){ resumeOnShow = false; play(); }
});

// start
var qt = new URLSearchParams(location.search).get('t');
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
resize();
if (qt !== null && !isNaN(parseFloat(qt))) seek(parseFloat(qt));
else if (reduce) seek(T_END);
else play(0);
})();
</script>
