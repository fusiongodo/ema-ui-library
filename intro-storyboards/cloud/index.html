<title>The Cloud</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --page:#EEF0F4; --ink:#1A2233; --muted:#5B6578; --accent:#A8731A;
  --btn:#FFFFFF; --btnline:#D3D8E2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#05070D; --ink:#E6E9F0; --muted:#8C95A8; --accent:#FFD27A;
    --btn:#121826; --btnline:#263045;
  }
}
:root[data-theme="dark"]{
  --page:#05070D; --ink:#E6E9F0; --muted:#8C95A8; --accent:#FFD27A;
  --btn:#121826; --btnline:#263045;
}
html,body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;}
body{overflow-x:hidden}
.wrap{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  padding:12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));}
.col{width:min(430px, 100%, calc((100vh - 96px) * 390 / 844));}
@supports (height:100dvh){ .col{width:min(430px, 100%, calc((100dvh - 96px) * 390 / 844));} }
.stage{position:relative;width:100%;aspect-ratio:390/844;border-radius:28px;overflow:hidden;background:#0B1120;
  cursor:pointer;-webkit-tap-highlight-color:transparent;}
.stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.word{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);color:#FFF1C9;font-weight:700;
  letter-spacing:.03em;opacity:0;pointer-events:none;white-space:nowrap;line-height:1;font-size:35px}
.bar{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px}
.bar input{flex:1;min-width:0;margin:0;accent-color:var(--accent)}
.btn{font:inherit;font-size:12px;color:var(--ink);background:var(--btn);border:1px solid var(--btnline);
  border-radius:999px;height:28px;padding:0 12px;cursor:pointer;white-space:nowrap}
.btn.icon{width:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.btn.speed{height:32px;min-width:44px;padding:0 8px;font-variant-numeric:tabular-nums}
.btn.speed.on{color:var(--accent);border-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;min-width:38px;text-align:right;color:var(--muted)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);min-height:28px}
.again[hidden]{display:none}
.panel{margin-top:14px;font-size:12px;color:var(--ink)}
.panel summary{cursor:pointer;font-weight:600;padding:6px 0;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr auto 32px;align-items:center;column-gap:6px;margin-top:6px}
.prow label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .val{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.prow input{grid-column:1 / 3;width:100%;min-width:0;height:32px;margin:0;accent-color:var(--accent)}
.prow .rs{grid-column:3;grid-row:1 / 3;width:32px;height:32px;padding:0}
.pbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pbtns .btn{height:32px}
.pline{margin-top:8px;padding:8px;border:1px solid var(--btnline);border-radius:8px;background:var(--btn);
  font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;user-select:all;-webkit-user-select:all}
</style>

<div class="wrap">
  <div class="col">
    <div class="stage" id="stage" aria-label="Intro-Animation, tippen startet neu">
      <div class="word" id="word">MEjority</div>
    </div>
    <div class="bar">
      <button class="btn icon" id="play" aria-label="Abspielen">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path id="playIcon" fill="currentColor" d="M2 1l9 5-9 5z"/></svg>
      </button>
      <button class="btn speed" id="speed" aria-label="Geschwindigkeit 1&times;">1&times;</button>
      <input type="range" id="scrub" min="0" max="13.8" step="0.01" value="0" aria-label="Zeit">
      <span class="time" id="time">0.0 s</span>
    </div>
    <div class="row2">
      <span id="step">Ein Stern</span>
      <button class="btn again" id="again" hidden>Noch mal</button>
    </div>
    <details class="panel" id="panel" open>
      <summary>Regler</summary>
      <div id="prows"></div>
      <div class="pbtns">
        <button class="btn" id="pReset">Alle zur&uuml;cksetzen</button>
        <button class="btn" id="pCopy">Werte kopieren</button>
      </div>
      <div class="pline" id="pLine">alles Standard</div>
    </details>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
// ---------------------------------------------------------------- constants
// TB = the moment the first broadcast signal left the centre in the earlier versions; SHIFT stays 0 (one version).
var TB = 5.50, SHIFT = 0;
var T_END = 13.8;   // set below
var N = 600;
var R = 10;
var ASPECT = 390 / 844;
var DEG = Math.PI / 180;
var OMEGA_OUT = 2 * Math.PI / 22;
var TILT = 62 * DEG;          // main plane: normal 62 deg away from the line of sight
var W0 = 0.45;                // visible half-width (world) at t = 0: the hero alone
var W_END = 11.5;             // visible half-width from 6.0 s on: cloud + small margin
var H_W = 2 * W_END / ASPECT; // stage height in world units in chart space

var COL_WARM = hex('#FFD27A'), COL_CHARGED = hex('#FFF1C9'),
    COL_BLUE = hex('#8FA3C4');
var BG = hex('#0B1120');

var STEPS = [
  [0.0,'Ein Stern'],[1.5,'Mehr und mehr'],[3.3,'Einige geben']
];  // the later steps are appended once the rain / ring times are known (see T_FALL0, R0)

function hex(h){ var n = parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; }
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
function seg(t,a,b){ return clamp01((t-a)/(b-a)); }
function lerp(a,b,u){ return a + (b-a)*u; }
function eIn(x){ return x*x*x; }
function eOut(x){ var y = 1-x; return 1 - y*y*y; }
function eIO(x){ return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; }
function eInQuart(x){ return x*x*x*x; }
function ss(x){ x = clamp01(x); return x*x*x*(x*(6*x - 15) + 10); }   // smootherstep
function ssI(x){ x = clamp01(x); return x*x*x*x*(x*(x - 3) + 2.5); } // integral of ss over 0..x

// seeded random (mulberry32)
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rand = rng(20261119);
function gauss(){ var u = Math.max(1e-9, rand()), v = rand(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }

// ---------------------------------------------------------------- stars
var S = [];
for (var i = 0; i < N; i++){
  var r = Math.max(1.5, R * Math.sqrt(rand()));
  if (i === 0) r = 6;
  var node = rand() * 2 * Math.PI, inc = (rand()*2 - 1) * 35 * DEG;
  if (i === 0) inc = 6 * DEG;
  var ux = Math.cos(node), uy = Math.sin(node);
  // v = in-plane perpendicular, tilted about u by inc
  var vx = -Math.sin(node) * Math.cos(inc), vy = Math.cos(node) * Math.cos(inc), vz = Math.sin(inc);
  S.push({
    r: r, ux: ux, uy: uy, vx: vx, vy: vy, vz: vz,
    ph: rand() * 2 * Math.PI,
    om: OMEGA_OUT * Math.pow(R / r, 0.5),
    size: 11 * (1 + (rand()*2 - 1) * 0.4),
    bright: i === 0 ? 0.85 : 0.6 + rand() * 0.3,
    twP: 1.5 + rand() * 1.5, twPh: rand() * 2 * Math.PI
  });
}

// orbit angle = integral of the spin rate; rate: 0 -> 1 (smootherstep 2.8..5.6: the turn is complete before the
// giving), 1 -> 0 (smootherstep 7.2..8.9, while the stars already rise: they spiral upward, the last turn dies as
// the last stars reach the line). SPIN_DIR: the cloud's own turn matches the apparent turn from the camera moving right.
var SPIN_DIR = -1, SPIN_T1 = 7.2 + SHIFT, SPIN_T2 = 8.9 + SHIFT, SP0 = 2.8, SP1 = 5.6;
function spinA(t){
  var U = SP1 - SP0, D = SPIN_T2 - SPIN_T1;
  var up = t <= SP0 ? 0 : t < SP1 ? U * ssI((t - SP0) / U) : U / 2 + (t - SP1);
  var dn = t <= SPIN_T1 ? 0 : t < SPIN_T2 ? D * ssI((t - SPIN_T1) / D) : D / 2 + (t - SPIN_T2);
  return SPIN_DIR * (up - dn);
}
// depth of the cloud along the view axis: flat until 2.8, full by 5.3
function depthS(t){ return eIO(seg(t, 2.8, 5.3)); }

var cT = Math.cos(TILT), sT = Math.sin(TILT);
function cloudPos(i, A, dz, out){
  var s = S[i], th = s.ph + s.om * A, c = Math.cos(th), sn = Math.sin(th);
  var x = s.r * (s.ux*c + s.vx*sn), y = s.r * (s.uy*c + s.vy*sn), z = s.r * (s.vz*sn);
  // rotate the face-on disc about X so its top leans away: normal = (0, sin62, cos62)
  out[0] = x;
  out[1] = y * cT + z * sT;
  out[2] = (-y * sT + z * cT) * dz;
  return out;
}

// ---------------------------------------------------------------- camera
// W(t): one eased curve in log space, 0.6 .. 6.0
function camW(t){ return W0 * Math.pow(W_END / W0, eIO(seg(t, 0.6, 6.0))); }
// the switch: one smootherstep over 6.20..8.2 for angles, fov and depth (starts with the first rise)
var SW_T1 = 6.20 + SHIFT, SW_T2 = 8.2 + SHIFT;
function swU(t){ return ss(seg(t, SW_T1, SW_T2)); }
function camFov(t){
  if (t < SW_T1) return 8 + 34 * eIO(seg(t, 2.8, 5.3));
  return 42 - 36 * swU(t);
}
function camAngles(t){
  var d = ss(seg(t, 2.6, 6.0)), b = swU(t);
  return [28 * DEG * d * (1-b), 8 * DEG * d * (1-b)];
}
function camDepth(t){ return t < SW_T1 ? depthS(t) : 1 - swU(t); }
var tmp = [0,0,0], tmp2 = [0,0,0];
function camTarget(t, out){
  cloudPos(0, spinA(t), depthS(t), out);
  var u = eIO(seg(t, 1.5, 4.5));
  out[0] *= 1-u; out[1] *= 1-u; out[2] *= 1-u;
  return out;
}

// ---------------------------------------------------------------- fade-in schedule (step 2)
var WTAB = []; for (var k = 0; k <= 600; k++) WTAB.push(camW(k * 0.01));
function camWinv(w){ for (var k = 0; k <= 600; k++) if (WTAB[k] >= w) return k * 0.01; return 6; }
var hero0 = cloudPos(0, 0, 0, [0,0,0]), p0 = [0,0,0], dmax = 0;
for (i = 0; i < N; i++){ cloudPos(i, 0, 0, p0); S[i].dh = Math.hypot(p0[0]-hero0[0], (p0[1]-hero0[1]) * ASPECT * 1.6); dmax = Math.max(dmax, S[i].dh); }
for (i = 1; i < N; i++){
  // first the hero's neighbours as the frame widens, then a wave running outward from the hero; all lit by 4.5
  var st = Math.min(camWinv(S[i].dh * 1.15), 2.5 + 1.4 * S[i].dh / dmax) + rand() * 0.12;
  S[i].fade = Math.max(1.2, Math.min(4.0, st));   // the hero is alone a little longer
}

// ---------------------------------------------------------------- givers (step 4)
var GIVE_GAP = 0.88 / 7, GIVE_T0 = 2.9, SPARK_DUR = 0.5;   // package travel 0.5 s
var givers = [0], givers0 = [0];
var HERO_B = 1.15 * (function(){ var m = 0; for (var j = 1; j < N; j++) m = Math.max(m, S[j].bright); return m; })();
// camera at time t (shared by render and the giver check)
function setCam(t, cam){
  var W = camW(t), fov = camFov(t), ang = camAngles(t);
  var dist = W / (Math.tan(fov/2*DEG) * ASPECT);
  camTarget(t, tmp);
  cam.fov = fov; cam.updateProjectionMatrix();
  cam.position.set(tmp[0] + dist*Math.sin(ang[0])*Math.cos(ang[1]),
                   tmp[1] + dist*Math.sin(ang[1]),
                   tmp[2] + dist*Math.cos(ang[0])*Math.cos(ang[1]));
  cam.lookAt(tmp[0], tmp[1], tmp[2]);
  cam.updateMatrixWorld(); cam.matrixWorldInverse.copy(cam.matrixWorld).invert();
  return dist;
}
var chkCam = new THREE.PerspectiveCamera(8, ASPECT, 0.05, 5000), chkV = new THREE.Vector3();
function onScreen(j, t, lim){   // live cloud position at t (stars orbit until the rise)
  cloudPos(j, spinA(t), depthS(t), p0);
  setCam(t, chkCam);
  chkV.set(p0[0], p0[1], p0[2]).project(chkCam);
  return chkV.z < 1 && Math.abs(chkV.x) <= lim && Math.abs(chkV.y) <= lim;
}
(function(){
  var sectors = [0,1,2,3,4,5,6,7];
  for (var a = 7; a > 0; a--){ var b = Math.floor(rand()*(a+1)), tt = sectors[a]; sectors[a] = sectors[b]; sectors[b] = tt; }
  var heroAng = Math.atan2(hero0[1], hero0[0]);
  sectors.forEach(function(sec){
    var cand = [];
    for (var j = 1; j < N; j++){
      if (S[j].r < 4 || S[j].r > 9.5) continue;
      cloudPos(j, 0, 1, p0);
      var ang = Math.atan2(p0[1], p0[0]) - heroAng;
      ang = ((ang % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
      if (Math.floor(ang / (Math.PI/4)) === sec && (sec !== 0 || ang > 0.3)) cand.push(j);
    }
    // same random draw as before; if that star is not lit or not inside the frame (5 % margin) at its give time,
    // take the next candidate of the sector that is (deterministic)
    var k0 = Math.floor(rand() * cand.length), tg = GIVE_T0 + givers.length * GIVE_GAP, pick = cand[k0];
    givers0.push(pick);
    givers.push(pick);   // the list stays as approved (0, 144, 67, 351, 301, 273, 344, 322, 107); no fallback
  });
})();
// the dialogue: gives from 3.30 to TB - 0.75 (18 in A, 12 in B), gaps shrinking linearly (first : last = 2.5 : 1);
// the last package arrives at TB - 0.25. The choice is deterministic and draws no random numbers (nothing else shifts).
var GIVE_N = 18, GIVE_FIRST = 3.30, GIVE_SPAN = TB - 0.75 - 3.30, GIVE_MARGIN = 0.9, GIVE_MIN_R = 0.35 * R;
var GIVE_T = [GIVE_FIRST], GIVE_LOG = [], GIVE_RELAXED = 0;
(function(){
  var gs = [], sum = 0, k;
  for (k = 0; k < GIVE_N - 1; k++){ gs.push(2.5 + (1 - 2.5) * k / (GIVE_N - 2)); sum += gs[k]; }
  for (k = 0; k < GIVE_N - 1; k++) GIVE_T.push(GIVE_T[k] + gs[k] * GIVE_SPAN / sum);
  GIVE_T[GIVE_N - 1] = GIVE_FIRST + GIVE_SPAN;
  // in frame (5 % margin) from the give until the package has arrived; screen direction seen from the centre
  function inFrame(j, t0){ for (var u = 0; u <= 10; u++) if (!onScreen(j, t0 + SPARK_DUR * u / 10, GIVE_MARGIN)) return false; return true; }
  function dirAt(j, t){
    setCam(t, chkCam);
    chkV.set(0, 0, 0).project(chkCam); var cx = chkV.x, cy = chkV.y;
    cloudPos(j, spinA(t), depthS(t), p0); chkV.set(p0[0], p0[1], p0[2]).project(chkCam);
    return Math.atan2((chkV.y - cy) / ASPECT, chkV.x - cx);
  }
  function turn(a, b){ var d = Math.abs(a - b) % (2*Math.PI); return d > Math.PI ? 2*Math.PI - d : d; }
  var oldG = givers.slice(1), slot = [], used = {}; used[0] = true;
  // in time order. Rules: not the hero, nobody twice, in frame, at least 35 % of the cloud radius from the centre,
  // a turn of 70..150 deg from the previous giver. Preferred: one of the eight earlier givers (+2), at least 40 deg
  // from the giver two before (+1); ties by a fixed hash of the star index.
  for (k = 0; k < GIVE_N; k++){
    var t = GIVE_T[k], best = -1, bestSc = -1, pass;
    var dPrev = k > 0 ? dirAt(slot[k-1], GIVE_T[k-1]) : null, dPrev2 = k > 1 ? dirAt(slot[k-2], GIVE_T[k-2]) : null;
    for (pass = 0; pass < 2 && best < 0; pass++){       // pass 1 only if nobody meets the turn rule (reported)
      for (var j = 1; j < N; j++){
        if (used[j] || S[j].r < GIVE_MIN_R) continue;
        var d = dirAt(j, t), tp = dPrev === null ? 110 * DEG : turn(d, dPrev), t2 = dPrev2 === null ? Math.PI : turn(d, dPrev2);
        if (pass === 0 && (tp < 70 * DEG || tp > 150 * DEG)) continue;
        var sc = (oldG.indexOf(j) >= 0 ? 2 : 0) + (t2 >= 40 * DEG ? 1 : 0) + ((j * 2654435761) % 1000) / 1000 * 0.999;
        if (sc > bestSc && inFrame(j, t)){ bestSc = sc; best = j; }
      }
      if (pass === 1 && best >= 0) GIVE_RELAXED++;
    }
    slot.push(best); used[best] = true;
  }
  for (k = 0; k < GIVE_N; k++){
    var g = slot[k], dk = dirAt(g, GIVE_T[k]);
    GIVE_LOG.push({ t: GIVE_T[k], star: g, old: oldG.indexOf(g) >= 0, inFrame: inFrame(g, GIVE_T[k]),
      turn: k > 0 ? turn(dk, dirAt(slot[k-1], GIVE_T[k-1])) / DEG : null,
      turn2: k > 1 ? turn(dk, dirAt(slot[k-2], GIVE_T[k-2])) / DEG : null, rShare: S[g].r / R });
  }
  givers = slot;
})();
givers.forEach(function(g, k){ S[g].give = GIVE_T[k]; });
var CEN_SZ = [30, 12.5, 12.5, 10, 10], CEN_B = [0.5, 0.2, 0.2, 0.1, 0.1];
var GIVE_A = GIVE_T.map(function(x){ return x + SPARK_DUR; });
GIVE_LOG.forEach(function(g, k){ g.arr = GIVE_A[k]; });
STEPS.push([4.2, 'Das Zentrum antwortet'], [5.2, 'Getroffen, aufsteigen']);
// a giver is fully lit 0.3 s before it gives (its ray starts 0.15 s before): move only its fade-in earlier,
// same 0.5 s duration, never before 1.2 s (the hero stays alone until then)
var fadeMoved = [];
givers.forEach(function(g){
  if (g === 0) return;
  var latest = S[g].give - 0.3 - 0.5;
  if (S[g].fade > latest){ var nf = Math.max(1.2, latest); fadeMoved.push([g, +(S[g].fade - nf).toFixed(3)]); S[g].fade = nf; }
});

// ---------------------------------------------------------------- resting cloud (orbit angle after the spin has stopped) + chart slots
var A_F = spinA(SPIN_T2);
var PF = []; for (i = 0; i < N; i++) PF.push(cloudPos(i, A_F, 1, [0,0,0]));
function sx(x){ return x * W_END; }            // stage x (-1..1) -> world
function sy(f){ return (0.5 - f) * H_W; }      // stage y (fraction from top) -> world
var Y_TOP = sy(0.14), Y_BASE = sy(0.78);
var PITCH = 2 * W_END / 68;                     // dot diameter in world units
var LEAVE_SPREAD = 0.5;   // short: with arrivals spread over 0.7 s, at most ~270 stars sit on the line at once
var RISE_T0 = 6.65 + SHIFT, RISE_STAG = 0.7, RISE_DUR = 1.1, PERM_SEED = 1;
var STREAM_T0 = 4.65, STREAM_SPAN = 2.55, STREAM_EXP = 0.45, STREAM_TRAVEL = 0.45, T_SW = 5.08;
function streamArr(k){ return STREAM_T0 + STREAM_SPAN * Math.pow(k / (N - 1), STREAM_EXP); }
function sstep(x){ x = clamp01(x); return x*x*(3 - 2*x); }   // smoothstep: the rise picks up sooner
// ---------------------------------------------------------------- tuning parameters (panel). Defaults = the film as built.
var PDEF = [
  ['riseAcc',   'Aufstieg: Beschleunigung',        0.5, 3.0, 0.1,  1.0],
  ['riseVmax',  'Aufstieg: H\u00f6chsttempo',          0.5, 3.0, 0.1,  1.0],
  ['riseFrom',  'Aufstieg ab (s)',                 4.6, 6.5, 0.01, 5.08],   // step 0.01: 5.08 is not on a 0.05 grid from 4.6
  ['raysOut',   'Sichtbare Strahlen nach au\u00dfen (%)', 10, 100, 5,  100],
  ['cSize',     'Zentrum: Gr\u00f6\u00dfe',               0.5, 2.0, 0.05, 1.0],
  ['cBright',   'Zentrum: Helligkeit',             0.5, 1.5, 0.05, 1.0],
  ['cPulse',    'Zentrum: Puls bei Treffer',       0,   4.0, 0.1,  1.0],
  ['cHalo',     'Zentrum: Halo',                   0,   5.0, 0.1,  1.0],
  ['cHaloSize', 'Zentrum: Halo-Gr\u00f6\u00dfe',          0.5, 3.0, 0.1,  1.0],
  ['inThick',   'Pakete nach innen: Dicke',        0.3, 3.0, 0.1,  1.0],
  ['inLen',     'Pakete nach innen: L\u00e4nge',        1.0, 6.0, 0.25, 1.0],
  ['outThick',  'Pakete nach au\u00dfen: Dicke',       0.3, 3.0, 0.1,  1.0],
  ['outLen',    'Pakete nach au\u00dfen: L\u00e4nge',       0.5, 4.0, 0.25, 1.0],
  ['bellGloss', 'Glocken: Glanz',                  0,   4.0, 0.1,  1.0]
];
var P = {}; PDEF.forEach(function(d){ P[d[0]] = d[5]; });
// rise progress p(u), u = 0..1 (start and line arrival fixed). Velocity p' = v (1 - r^2) before the peak (r = distance to
// the peak as a share of the time to peak, today's parabola half), v (1 - s)^k (1 + k s) after it (s = share of the
// remaining time). Peak at u_p = 0.5 / riseAcc, peak speed v = 1.5 riseVmax; k follows from p(1) = 1:
// v (2/3 u_p + (1 - u_p) 2 / (k + 2)) = 1. Feasible: u_p <= 0.9, 1 <= k <= 20 (k = 1 is today's falling half), so

  chart.visible = t >= 6.9 + SHIFT && t < TR_FADE + 0.5;         // leaves together with the bell outlines
  chart.material.opacity = 0.45 * (1 - seg(t, TR_FADE, TR_FADE + 0.5));
  var half = 0.84 * cp;
  var L = [
    [0, Y_BASE, -half, Y_BASE], [0, Y_BASE, half, Y_BASE],
    [0, Y_TOP, -half, Y_TOP], [0, Y_TOP, half, Y_TOP]
  ];
  for (k = 0; k < 4; k++){
    cPos[k*6] = sx(L[k][0]); cPos[k*6+1] = L[k][1]; cPos[k*6+2] = 0;
    cPos[k*6+3] = sx(L[k][2]); cPos[k*6+4] = L[k][3]; cPos[k*6+5] = 0;
  }
  for (k = 0; k < 21; k++){
    var tx = -0.84 + 1.68 * k / 20, tl = clamp01((half - Math.abs(tx)) / 0.06) * 0.012 * H_W;
    var o2 = (4 + k) * 6;
    cPos[o2] = sx(tx); cPos[o2+1] = Y_BASE; cPos[o2+2] = 0;
    cPos[o2+3] = sx(tx); cPos[o2+4] = Y_BASE - tl; cPos[o2+5] = 0;
  }
  cg.attributes.position.needsUpdate = true;

  // bell outlines
  // full width from BELL_T1, growing upward out of the baseline while the stars fall; pale first
  var bh = sstep(seg(t, BELL_T1, BELL_T2));
  bells.forEach(function(l, gp){
    var lf = 1 - seg(t, TR_FADE, TR_FADE + 0.5);
    l.visible = t >= BELL_T1 && t < TR_FADE + 0.5;
    l.material.opacity = (0.12 + 0.58 * bh * bh) * lf;
    var pos = l.geometry.attributes.position.array, c = CENTRES[gp];
    var x0 = c - 3.2*SIGMA, x1 = c + 3.2*SIGMA;
    for (var k = 0; k < NB; k++){
      var x = lerp(x0, x1, k / (NB-1)), z = (x - c) / SIGMA;
      pos[k*3] = sx(x);
      pos[k*3+1] = Y_BASE + bh * (BELL_PEAK * Math.exp(-z*z/2) + 1.1) * PITCH;
      pos[k*3+2] = 0;
    }
    l.geometry.attributes.position.needsUpdate = true;
    // trace: wake brightens the line through its vertex colour (at full wake it reads as opacity 1.0 instead of 0.7)
    // and shows as a soft band of points on the vertices; the head rides on the outline
    var bc = gp === 0 ? COL_BLUE : COL_WARM, colA = l.geometry.attributes.color.array;
    for (k = 0; k < NB; k++){
      var gk = trGlow(gp, k, t), fk = 1 + (LINE_BOOST[gp] - 1) * gk * P.bellGloss, jw = 2 + gp*NB + k;
      for (var q5 = 0; q5 < 3; q5++){ colA[k*3+q5] = Math.min(1, bc[q5] * fk); trCol[jw*3+q5] = bc[q5]; }
      trPos[jw*3] = pos[k*3]; trPos[jw*3+1] = pos[k*3+1]; trPos[jw*3+2] = 0;
      trSize[jw] = BAND_SIZE; trBright[jw] = BAND_B * gk * lf * P.bellGloss;
    }
    l.geometry.attributes.color.needsUpdate = true;
    var hu2 = trHeadU(gp, t), hx = lerp(x0, x1, hu2), hz = (hx - c) / SIGMA;
    trPos[gp*3] = sx(hx); trPos[gp*3+1] = Y_BASE + bh * (BELL_PEAK * Math.exp(-hz*hz/2) + 1.1) * PITCH; trPos[gp*3+2] = 0;
    trSize[gp] = 6; trBright[gp] = trHeadB(gp, t) * lf * P.bellGloss;
    for (q5 = 0; q5 < 3; q5++) trCol[gp*3+q5] = bc[q5] + (HEAD_WHITE[q5] - bc[q5]) * HEAD_MIX;
  });
  tracePts.visible = t >= TR0 && t < TR_CUT;
  for (var an in trg.attributes) trg.attributes[an].needsUpdate = true;

  pg.attributes.position.needsUpdate = true;
  pg.attributes.aSize.needsUpdate = true;
  pg.attributes.aBright.needsUpdate = true;
  pg.attributes.aColor.needsUpdate = true;
  pg.attributes.aSquash.needsUpdate = true;
  pg.attributes.aSharp.needsUpdate = true;

  bgCol.setRGB(BG[0], BG[1], BG[2]);
  renderer.setClearColor(bgCol, 1);

  // wordmark: revealed in place by a soft wipe from left to right while the ring closes (sine ease-in-out, WORD_T0 .. WORD_T1).
  // Mask edge E (centre of a soft zone 25 % of the word's width) runs from -12.5 % (nothing visible) to 112.5 % (all visible).
  // A gleam rides on the reveal, letters only (background-clip: text): a band 18 % wide centred 9 % behind E, warm white
  // #FFFBEF at its centre falling off (cos^2) to the base colour #FFF1C9; its strength eases out over the last 20 % of p
  // (at p = 1 the band would still overlap the word's right end). Glow: drop-shadow in the base colour, blur 6 px,
  // alpha 0.35 sin(pi p). From WORD_T1 on the word is plain.
  var wp = 0.5 - 0.5 * Math.cos(Math.PI * seg(t, WORD_T0, WORD_T1));
  word.style.opacity = t >= WORD_T0 ? '1' : '0';
  var wm = 'none', wBg = 'none', wClip = '', wCol = '', wFil = '';
  if (wp < 1){
    var wE = -12.5 + 125 * wp, wC = wE - 9, wF = sstep((1 - wp) / 0.2);
    wm = 'linear-gradient(to right, #000 ' + (wE - 12.5).toFixed(3) + '%, transparent ' + (wE + 12.5).toFixed(3) + '%)';
    if (t >= WORD_T0){
      var wMix = function(a){ return 'rgb(255,' + (241 + 10 * a).toFixed(2) + ',' + (201 + 38 * a).toFixed(2) + ')'; };
      wBg = 'linear-gradient(to right, #FFF1C9 ' + (wC - 9).toFixed(3) + '%, ' + wMix(0.5 * wF) + ' ' + (wC - 4.5).toFixed(3) + '%, ' +
            wMix(wF) + ' ' + wC.toFixed(3) + '%, ' + wMix(0.5 * wF) + ' ' + (wC + 4.5).toFixed(3) + '%, #FFF1C9 ' + (wC + 9).toFixed(3) + '%)';
      wClip = 'text'; wCol = 'transparent';
      wFil = 'drop-shadow(0 0 6px rgba(255,241,201,' + (0.35 * Math.sin(Math.PI * wp)).toFixed(4) + '))';
    }
  }
  word.style.webkitMaskImage = wm; word.style.maskImage = wm;
  word.style.backgroundImage = wBg; word.style.webkitBackgroundClip = wClip; word.style.backgroundClip = wClip;
  word.style.color = wCol; word.style.filter = wFil;
  word.dataset.gleam = wBg === 'none' ? '' : wC.toFixed(3) + ',' + (0.35 * Math.sin(Math.PI * wp)).toFixed(4) + ',' + wF.toFixed(4);
  renderer.render(scene, camera);
}

// ---------------------------------------------------------------- sizing
function resize(){
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  pMat.uniforms.uScale.value = (w / 390) * renderer.getPixelRatio();
  word.style.fontSize = (w * 0.09).toFixed(1) + 'px';
  render(cur);
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- playback + controls
var cur = 0, playing = false, t0wall = 0, raf = 0, resumeOnShow = false;
// slow motion: the clock advances by wall time × speed (render, seek and the time display stay in film time)
var SPEEDS = [1, 0.5, 0.25, 0.1], speedK = 0, speed = 1, curAnchor = 0, speedBtn = document.getElementById('speed');
function anchor(){ t0wall = performance.now(); curAnchor = cur; }
var playBtn = document.getElementById('play'), playIcon = document.getElementById('playIcon'),
    scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'),
    stepEl = document.getElementById('step'), again = document.getElementById('again');
scrub.max = String(T_END);

function ui(){
  scrub.value = cur.toFixed(2);
  timeEl.textContent = cur.toFixed(1) + ' s';
  var name = STEPS[0][1];
  for (var k = 0; k < STEPS.length; k++) if (cur >= STEPS[k][0]) name = STEPS[k][1];
  stepEl.textContent = name;
  playIcon.setAttribute('d', playing ? 'M2 1h3v10H2zM7 1h3v10H7z' : 'M2 1l9 5-9 5z');
  playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Abspielen');
  again.hidden = cur < T_END;
}
function frame(now){
  if (!playing) return;
  cur = Math.min(T_END, curAnchor + Math.max(0, now - t0wall) / 1000 * speed);
  render(cur);
  if (cur >= T_END) playing = false;
  ui();
  if (playing) raf = requestAnimationFrame(frame);
}
function play(from){
  if (from !== undefined) cur = from;
  if (cur >= T_END) cur = 0;
  playing = true;
  anchor();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(frame);
  ui();
}
function pause(){ playing = false; cancelAnimationFrame(raf); ui(); }
function seek(t){
  cur = Math.max(0, Math.min(T_END, +t || 0));
  if (playing) anchor();
  render(cur); ui();
}
window.seek = seek;
window.__cloud = { camera: camera, pos: pPos, bright: pBright, S: S,
  times: { T_FALL0: T_FALL0, T_LAND: T_LAND, R0: R0, R0_OLD: R0_OLD, T_END: T_END, RUN_MIN: RUN.min / DEG, RUN_MAX: RUN.max / DEG, NSPI: NSPI, CRUISE: RING_CRUISE / DEG, RING_C: RING_C, RING_R: RING_R, BELL_T1: BELL_T1, BELL_T2: BELL_T2, RISE_DUR: RISE_DUR, RL: RL, DEP_CLAMPED: DEP_CLAMPED, TR0: TR0, TR_END: TR_END, TR_FADE: TR_FADE, TR_CUT: TR_CUT }, trace: { headU: trHeadU, headB: trHeadB, glow: trGlow, BAND_B: BAND_B, BAND_SIZE: BAND_SIZE, bright: trBright, NB: NB }, GIVE_LOG: GIVE_LOG, GIVE_RELAXED: GIVE_RELAXED, TB: TB, gCol: gCol, orbit: function(i, t){ return cloudPos(i, spinA(t), depthS(t), [0,0,0]); }, STEPS: STEPS, givers: givers, givers0: givers0, fadeMoved: fadeMoved,
  size: pSize, idx: { I_GLOW: I_GLOW, I_MINI: I_MINI, I_CHALO: I_CHALO, PK: PK, NG: NG } };

// ---------------------------------------------------------------- tuning panel
var PKEY = 'cloud.tune.v1', pInputs = {}, pVals = {};
function pDec(st){ var x = String(st), d = x.indexOf('.'); return d < 0 ? 0 : x.length - d - 1; }
function pLine(){
  var parts = [];
  PDEF.forEach(function(d){ if (P[d[0]] !== d[5]) parts.push(d[0] + '=' + P[d[0]]); });
  return parts.length ? parts.join('; ') : 'alles Standard';
}
function pShow(){
  PDEF.forEach(function(d){
    var k = d[0], txt = P[k].toFixed(pDec(d[4]));
    if (k === 'riseAcc' && Math.abs(RC.accEff - P.riseAcc) > 0.005) txt += ' (→' + RC.accEff.toFixed(2) + ')';
    if (k === 'riseVmax' && Math.abs(RC.vEff - P.riseVmax) > 0.005) txt += ' (→' + RC.vEff.toFixed(2) + ')';
    if (pVals[k]) pVals[k].textContent = txt;
    if (pInputs[k] && parseFloat(pInputs[k].value) !== P[k]) pInputs[k].value = String(P[k]);
  });
  var ln = document.getElementById('pLine'); if (ln) ln.textContent = pLine();
}
function pApply(){
  riseCurveSet(); applyRise(); capEnsure();
  try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (e) {}
  render(cur); pShow();
}
function setParams(obj){
  PDEF.forEach(function(d){
    if (obj && Object.prototype.hasOwnProperty.call(obj, d[0])){
      var v = +obj[d[0]]; if (isFinite(v)) P[d[0]] = Math.min(d[3], Math.max(d[2], v));
    }
  });
  pApply();
}
(function(){
  var box = document.getElementById('prows');
  PDEF.forEach(function(d){
    var row = document.createElement('div'); row.className = 'prow';
    var lab = document.createElement('label'); lab.textContent = d[1]; lab.htmlFor = 'p_' + d[0];
    var val = document.createElement('span'); val.className = 'val';
    var inp = document.createElement('input'); inp.type = 'range'; inp.id = 'p_' + d[0];
    inp.min = String(d[2]); inp.max = String(d[3]); inp.step = String(d[4]); inp.value = String(d[5]);
    var rs = document.createElement('button'); rs.className = 'btn rs'; rs.textContent = '↺'; rs.setAttribute('aria-label', d[1] + ' zurücksetzen');
    inp.addEventListener('input', function(){ P[d[0]] = parseFloat(inp.value); pApply(); });
    rs.addEventListener('click', function(){ P[d[0]] = d[5]; pApply(); });
    row.appendChild(lab); row.appendChild(val); row.appendChild(rs); row.appendChild(inp); box.appendChild(row);
    pInputs[d[0]] = inp; pVals[d[0]] = val;
  });
  document.getElementById('pReset').addEventListener('click', function(){ PDEF.forEach(function(d){ P[d[0]] = d[5]; }); pApply(); });
  document.getElementById('pCopy').addEventListener('click', function(){
    var txt = pLine();
    try { if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(function(){}); } catch (e) {}
  });
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch (e) { saved = null; }
  if (saved && typeof saved === 'object'){
    PDEF.forEach(function(d){ var v = +saved[d[0]]; if (d[0] in saved && isFinite(v)) P[d[0]] = Math.min(d[3], Math.max(d[2], v)); });
    riseCurveSet(); applyRise(); capEnsure();
  }
  pShow();
})();
Object.defineProperty(window.__cloud, 'params', { get: function(){ var o = {}; for (var k in P) o[k] = P[k]; return o; } });
window.__cloud.setParams = setParams;
window.__cloud.riseP = riseP;
window.__cloud.riseInfo = function(){ return { up: RC.up, v: RC.v, k: RC.k, accEff: RC.accEff, vEff: RC.vEff,
  clamped: !RC.def && (Math.abs(RC.accEff - P.riseAcc) > 0.005 || Math.abs(RC.vEff - P.riseVmax) > 0.005) }; };

playBtn.addEventListener('click', function(){ playing ? pause() : play(); });
speedBtn.addEventListener('click', function(){
  speedK = (speedK + 1) % SPEEDS.length; speed = SPEEDS[speedK];
  if (playing) anchor();
  var lab = String(speed) + '\u00D7';
  speedBtn.textContent = lab; speedBtn.setAttribute('aria-label', 'Geschwindigkeit ' + lab);
  speedBtn.classList.toggle('on', speed !== 1);
});
Object.defineProperty(window.__cloud, 'speed', { get: function(){ return speed; } });
again.addEventListener('click', function(){ play(0); });
stage.addEventListener('click', function(){ play(0); });
scrub.addEventListener('input', function(){ if (playing) pause(); seek(parseFloat(scrub.value)); });
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ resumeOnShow = playing; if (playing) pause(); }
  else if (resumeOnShow){ resumeOnShow = false; play(); }
});

// start
var qt = new URLSearchParams(location.search).get('t');
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
resize();
if (qt !== null && !isNaN(parseFloat(qt))) seek(parseFloat(qt));
else if (reduce) seek(T_END);
else play(0);
})();
</script>
