<title>The Cloud</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --page:#EEF0F4; --ink:#1A2233; --muted:#5B6578; --accent:#A8731A;
  --btn:#FFFFFF; --btnline:#D3D8E2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#05070D; --ink:#E6E9F0; --muted:#8C95A8; --accent:#FFD27A;
    --btn:#121826; --btnline:#263045;
  }
}
:root[data-theme="dark"]{
  --page:#05070D; --ink:#E6E9F0; --muted:#8C95A8; --accent:#FFD27A;
  --btn:#121826; --btnline:#263045;
}
html,body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;}
body{overflow-x:hidden}
.wrap{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  padding:12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));}
.col{width:min(430px, 100%, calc((100vh - 96px) * 390 / 844));}
@supports (height:100dvh){ .col{width:min(430px, 100%, calc((100dvh - 96px) * 390 / 844));} }
.stage{position:relative;width:100%;aspect-ratio:390/844;border-radius:28px;overflow:hidden;background:#0B1120;
  cursor:pointer;-webkit-tap-highlight-color:transparent;}
.stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.word{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);color:#FFF1C9;font-weight:700;
  letter-spacing:.03em;opacity:0;pointer-events:none;white-space:nowrap;line-height:1;font-size:35px}
.bar{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px}
.bar input{flex:1;min-width:0;margin:0;accent-color:var(--accent)}
.btn{font:inherit;font-size:12px;color:var(--ink);background:var(--btn);border:1px solid var(--btnline);
  border-radius:999px;height:28px;padding:0 12px;cursor:pointer;white-space:nowrap}
.btn.icon{width:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.time{font-variant-numeric:tabular-nums;min-width:38px;text-align:right;color:var(--muted)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);min-height:28px}
.again[hidden]{display:none}
</style>

<div class="wrap">
  <div class="col">
    <div class="stage" id="stage" aria-label="Intro-Animation, tippen startet neu">
      <div class="word" id="word">MEjority</div>
    </div>
    <div class="bar">
      <button class="btn icon" id="play" aria-label="Abspielen">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path id="playIcon" fill="currentColor" d="M2 1l9 5-9 5z"/></svg>
      </button>
      <input type="range" id="scrub" min="0" max="18" step="0.01" value="0" aria-label="Zeit">
      <span class="time" id="time">0.0 s</span>
    </div>
    <div class="row2">
      <span id="step">Ein Stern</span>
      <button class="btn again" id="again" hidden>Noch mal</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
// ---------------------------------------------------------------- constants
var T_END = 18.0;
var N = 600;
var R = 10;
var ASPECT = 390 / 844;
var DEG = Math.PI / 180;
var OMEGA_OUT = 2 * Math.PI / 22;
var TILT = 62 * DEG;          // main plane: normal 62 deg away from the line of sight
var W0 = 0.45;                // visible half-width (world) at t = 0: the hero alone
var W_END = 11.5;             // visible half-width from 6.0 s on: cloud + small margin
var H_W = 2 * W_END / ASPECT; // stage height in world units in chart space

var COL_WARM = hex('#FFD27A'), COL_CHARGED = hex('#FFF1C9'),
    COL_BLUE = hex('#8FA3C4');
var BG = hex('#0B1120');

var STEPS = [
  [0.0,'Ein Stern'],[1.5,'Mehr und mehr'],[3.5,'Eine Wolke im Raum'],[7.0,'Einige geben'],
  [8.8,'Das Zentrum antwortet'],[9.7,'Der Wechsel'],[10.3,'Alle nehmen teil'],
  [11.2,'Regen, zwei Glocken'],[13.2,'Stille'],[14.0,'Der Kreis'],[15.6,'MEjority']
];

function hex(h){ var n = parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; }
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
function seg(t,a,b){ return clamp01((t-a)/(b-a)); }
function lerp(a,b,u){ return a + (b-a)*u; }
function eIn(x){ return x*x*x; }
function eOut(x){ var y = 1-x; return 1 - y*y*y; }
function eIO(x){ return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; }
function eInQuart(x){ return x*x*x*x; }
function eOutQuad(x){ return 1 - (1-x)*(1-x); }

// seeded random (mulberry32)
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rand = rng(20261119);
function gauss(){ var u = Math.max(1e-9, rand()), v = rand(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }

// ---------------------------------------------------------------- stars
var S = [];
for (var i = 0; i < N; i++){
  var r = Math.max(1.5, R * Math.sqrt(rand()));
  if (i === 0) r = 6;
  var node = rand() * 2 * Math.PI, inc = (rand()*2 - 1) * 35 * DEG;
  if (i === 0) inc = 6 * DEG;
  var ux = Math.cos(node), uy = Math.sin(node);
  // v = in-plane perpendicular, tilted about u by inc
  var vx = -Math.sin(node) * Math.cos(inc), vy = Math.cos(node) * Math.cos(inc), vz = Math.sin(inc);
  S.push({
    r: r, ux: ux, uy: uy, vx: vx, vy: vy, vz: vz,
    ph: rand() * 2 * Math.PI,
    om: OMEGA_OUT * Math.pow(R / r, 0.5),
    size: 11 * (1 + (rand()*2 - 1) * 0.4),
    bright: i === 0 ? 0.85 : 0.6 + rand() * 0.3,
    twP: 1.5 + rand() * 1.5, twPh: rand() * 2 * Math.PI
  });
}

// orbit angle integral of spin(t); spin: 0 -> 1 ease-in (cubic) 3.5..5.5, frozen at 9.7
function spinA(t){
  var tt = Math.min(t, 9.7);
  if (tt <= 3.5) return 0;
  if (tt <= 5.5){ var s = (tt-3.5)/2; return s*s*s*s / 2; }
  return 0.5 + (tt - 5.5);
}
// depth of the cloud along the view axis: flat until 3.5, full by 6.0
function depthS(t){ return eIO(seg(t, 3.5, 6.0)); }

var cT = Math.cos(TILT), sT = Math.sin(TILT);
function cloudPos(i, A, dz, out){
  var s = S[i], th = s.ph + s.om * A, c = Math.cos(th), sn = Math.sin(th);
  var x = s.r * (s.ux*c + s.vx*sn), y = s.r * (s.uy*c + s.vy*sn), z = s.r * (s.vz*sn);
  // rotate the face-on disc about X so its top leans away: normal = (0, sin62, cos62)
  out[0] = x;
  out[1] = y * cT + z * sT;
  out[2] = (-y * sT + z * cT) * dz;
  return out;
}

// ---------------------------------------------------------------- camera
// W(t): one eased curve in log space, 0.6 .. 6.0
function camW(t){ return W0 * Math.pow(W_END / W0, eIO(seg(t, 0.6, 6.0))); }
function camFov(t){
  if (t < 9.95) return 8 + 34 * eIO(seg(t, 3.5, 6.0));
  return 42 - 36 * eIO(seg(t, 9.95, 10.55));
}
function camAngles(t){
  var d = eIO(seg(t, 3.5, 6.5)), b = eIO(seg(t, 9.95, 10.55));
  return [28 * DEG * d * (1-b), 8 * DEG * d * (1-b)];
}
var tmp = [0,0,0], tmp2 = [0,0,0];
function camTarget(t, out){
  cloudPos(0, spinA(t), depthS(t), out);
  var u = eIO(seg(t, 1.5, 4.5));
  out[0] *= 1-u; out[1] *= 1-u; out[2] *= 1-u;
  return out;
}

// ---------------------------------------------------------------- fade-in schedule (step 2)
var WTAB = []; for (var k = 0; k <= 600; k++) WTAB.push(camW(k * 0.01));
function camWinv(w){ for (var k = 0; k <= 600; k++) if (WTAB[k] >= w) return k * 0.01; return 6; }
var hero0 = cloudPos(0, 0, 0, [0,0,0]), p0 = [0,0,0], dmax = 0;
for (i = 0; i < N; i++){ cloudPos(i, 0, 0, p0); S[i].dh = Math.hypot(p0[0]-hero0[0], (p0[1]-hero0[1]) * ASPECT * 1.6); dmax = Math.max(dmax, S[i].dh); }
for (i = 1; i < N; i++){
  // first the hero's neighbours as the frame widens, then a wave running outward from the hero; all lit by 4.5
  var st = Math.min(camWinv(S[i].dh * 1.15), 2.5 + 1.4 * S[i].dh / dmax) + rand() * 0.12;
  S[i].fade = Math.max(0.8, Math.min(4.0, st));
}

// ---------------------------------------------------------------- givers (step 4)
var GIVE_GAP = 0.1375, GIVE_T0 = 7.0, SPARK_DUR = 0.7;
var givers = [0];
(function(){
  var sectors = [0,1,2,3,4,5,6,7];
  for (var a = 7; a > 0; a--){ var b = Math.floor(rand()*(a+1)), tt = sectors[a]; sectors[a] = sectors[b]; sectors[b] = tt; }
  var heroAng = Math.atan2(hero0[1], hero0[0]);
  sectors.forEach(function(sec){
    var cand = [];
    for (var j = 1; j < N; j++){
      if (S[j].r < 4 || S[j].r > 9.5) continue;
      cloudPos(j, 0, 1, p0);
      var ang = Math.atan2(p0[1], p0[0]) - heroAng;
      ang = ((ang % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
      if (Math.floor(ang / (Math.PI/4)) === sec && (sec !== 0 || ang > 0.3)) cand.push(j);
    }
    givers.push(cand[Math.floor(rand() * cand.length)]);
  });
})();
givers.forEach(function(g, k){ S[g].give = GIVE_T0 + k * GIVE_GAP; });

// ---------------------------------------------------------------- frozen cloud + chart slots
var A_F = spinA(9.7);
var PF = []; for (i = 0; i < N; i++) PF.push(cloudPos(i, A_F, 1, [0,0,0]));
function sx(x){ return x * W_END; }            // stage x (-1..1) -> world
function sy(f){ return (0.5 - f) * H_W; }      // stage y (fraction from top) -> world
var Y_TOP = sy(0.14), Y_BASE = sy(0.78);
var PITCH = 2 * W_END / 68;                     // dot diameter in world units

(function(){
  var ord = []; for (var j = 0; j < N; j++) ord.push(j);
  ord.sort(function(a,b){ return PF[a][0] - PF[b][0]; });
  ord.forEach(function(j, k){ S[j].slotX = sx(-0.84 + 1.68 * (k + 0.5) / N); });
  var ymin = 1e9, ymax = -1e9;
  for (j = 0; j < N; j++){ ymin = Math.min(ymin, PF[j][1]); ymax = Math.max(ymax, PF[j][1]); }
  for (j = 0; j < N; j++) S[j].rise = 10.4 + 0.12 * (1 - (PF[j][1] - ymin) / (ymax - ymin));
})();
var RISE_DUR = 0.30, OVER_DUR = 0.13, OVER_H = 0.03 * H_W / 0.58;

// rain + heaps
var SIGMA = 0.11, CENTRES = [-0.22, 0.22], PX = 2/68;
(function(){
  var ord = []; for (var j = 0; j < N; j++) ord.push(j);
  for (var a = N-1; a > 0; a--){ var b = Math.floor(rand()*(a+1)), tt = ord[a]; ord[a] = ord[b]; ord[b] = tt; }
  var cols = {};
  ord.forEach(function(j, k){
    var s = S[j];
    s.group = k < N/2 ? 0 : 1;
    s.leave = 11.2 + rand() * 1.1;
    s.fall = 0.55 + rand() * 0.35;
    s.land = s.leave + s.fall;
    var z = Math.max(-3, Math.min(3, gauss()));
    var kc = Math.round(z * SIGMA / PX);
    s.col = kc;
    s.colX = sx(CENTRES[s.group] + kc * PX);
    var key = s.group + ':' + kc;
    (cols[key] = cols[key] || []).push(j);
  });
  Object.keys(cols).forEach(function(key){
    var list = cols[key];
    list.sort(function(a,b){ return S[a].land - S[b].land; });
    list.forEach(function(j, h){
      S[j].h = h;
      S[j].landY = Y_BASE + (h + 0.6) * PITCH;
      S[j].above = list.slice(h+1).map(function(q){ return [S[q].land, S[q].h - h]; });
    });
  });
  for (j = 0; j < N; j++){ var s = S[j]; s.g = 2 * (Y_TOP - s.landY) / (s.fall * s.fall); }
})();

// ring
var RING_C = sy(0.44), RING_R = 0.3 * 2 * W_END;
(function(){
  [0,1].forEach(function(gp){
    var list = []; for (var j = 0; j < N; j++) if (S[j].group === gp) list.push(j);
    list.sort(function(a,b){
      var d = gp === 0 ? S[a].colX - S[b].colX : S[b].colX - S[a].colX;
      return d !== 0 ? d : S[b].h - S[a].h;
    });
    var M = list.length;
    list.forEach(function(j, k){
      var s = S[j];
      s.ringA = gp === 0 ? Math.PI/2 + Math.PI * (k + 0.5) / M : Math.PI/2 - Math.PI * (k + 0.5) / M;
      s.ringT = 14.0 + 0.4 * k / (M - 1);
    });
  });
})();
var RING_W = 2 * Math.PI / 14;
function ringRot(t){
  if (t <= 15) return 0;
  if (t <= 15.5) return RING_W * (t-15)*(t-15) / (2*0.5);
  return RING_W * (t - 15 - 0.25);
}
function ringRad(t){ return RING_R * (1 + 0.015 * Math.sin(2*Math.PI*(t-15)/3.6) * eIO(seg(t,15,15.8))); }

// ---------------------------------------------------------------- star position / look
function starPos(i, t, out){
  var s = S[i];
  if (t < s.rise) return cloudPos(i, spinA(t), depthS(t), out);
  var P = PF[i];
  if (t < 14.0 || t < s.ringT){
    if (t < s.rise + RISE_DUR){
      var u = (t - s.rise) / RISE_DUR, e = eIO(u);
      out[0] = lerp(P[0], s.slotX, e); out[1] = lerp(P[1], Y_TOP, eInQuart(u)); out[2] = lerp(P[2], 0, e);
      return out;
    }
    if (t < s.leave){
      var o = seg(t, s.rise + RISE_DUR, s.rise + RISE_DUR + OVER_DUR);
      out[0] = s.slotX; out[1] = Y_TOP + OVER_H * Math.sin(Math.PI*o) * (1-o); out[2] = 0;
      return out;
    }
    if (t < s.land){
      var tau = t - s.leave;
      out[0] = lerp(s.slotX, s.colX, eIO(tau / s.fall));
      out[1] = Y_TOP - 0.5 * s.g * tau * tau; out[2] = 0;
      return out;
    }
    out[0] = s.colX; out[1] = s.landY; out[2] = 0;
    return out;
  }
  // ring
  var a = s.ringA + ringRot(t), rr = ringRad(t);
  var x1 = rr * Math.cos(a), y1 = RING_C + rr * Math.sin(a);
  var v = seg(t, s.ringT, s.ringT + 1.1);
  if (v >= 1){ out[0] = x1; out[1] = y1; out[2] = 0; return out; }
  var x0 = s.colX, y0 = s.landY, dl = Math.hypot(x1-x0, y1-y0);
  var cx = (x0+x1)/2 + (s.group === 0 ? -1 : 1) * 0.32 * dl, cy = (y0+y1)/2 + 0.1 * dl;
  var e2 = eIO(v), m = 1 - e2;
  out[0] = m*m*x0 + 2*m*e2*cx + e2*e2*x1;
  out[1] = m*m*y0 + 2*m*e2*cy + e2*e2*y1;
  out[2] = 0;
  return out;
}

// ---------------------------------------------------------------- three.js
var stage = document.getElementById('stage');
var word = document.getElementById('word');
var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
stage.insertBefore(renderer.domElement, word);
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(8, ASPECT, 0.05, 5000);

var NP = N + 9*4 + 1 + N;           // stars, sparks (head + 3 tail), centre glow, ray heads
var I_SPARK = N, I_GLOW = N + 36, I_HEAD = N + 37;
var pPos = new Float32Array(NP*3), pSize = new Float32Array(NP), pBright = new Float32Array(NP),
    pCol = new Float32Array(NP*3), pSq = new Float32Array(NP);
var pg = new THREE.BufferGeometry();
pg.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pg.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1));
pg.setAttribute('aBright', new THREE.BufferAttribute(pBright, 1));
pg.setAttribute('aColor', new THREE.BufferAttribute(pCol, 3));
pg.setAttribute('aSquash', new THREE.BufferAttribute(pSq, 1));
var pMat = new THREE.ShaderMaterial({
  uniforms: { uScale: { value: 1 }, uRef: { value: 1 }, uDepth: { value: 0 } },
  vertexShader: [
    'attribute float aSize; attribute float aBright; attribute vec3 aColor; attribute float aSquash;',
    'uniform float uScale; uniform float uRef; uniform float uDepth;',
    'varying vec3 vCol; varying float vSq;',
    'void main(){',
    '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
    '  float k = clamp(uRef / max(-mv.z, 0.001), 0.3, 3.0);',
    '  float ks = pow(k, 2.0 * uDepth);',
    '  gl_PointSize = aSize * uScale * ks;',
    '  vCol = aColor * aBright * pow(k, 1.2 * uDepth);',
    '  vSq = aSquash;',
    '  gl_Position = projectionMatrix * mv;',
    '}'].join('\n'),
  fragmentShader: [
    'varying vec3 vCol; varying float vSq;',
    'void main(){',
    '  vec2 p = gl_PointCoord * 2.0 - 1.0;',
    '  p.x /= (1.0 + vSq); p.y /= (1.0 - vSq);',
    '  float d2 = dot(p, p);',
    '  if (d2 > 1.0) discard;',
    '  float core = exp(-d2 * 22.0);',
    '  float halo = exp(-d2 * 5.0) * 0.16 * (1.0 - d2);',
    '  gl_FragColor = vec4(vCol * (core + halo), 1.0);',
    '}'].join('\n'),
  blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, depthTest: false
});
var points = new THREE.Points(pg, pMat);
points.frustumCulled = false;
scene.add(points);

function lineMat(opacity){
  return new THREE.LineBasicMaterial({ vertexColors: true, blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, depthTest: false, opacity: opacity });
}
// rays
var rPos = new Float32Array(N*6), rCol = new Float32Array(N*6);
var rg = new THREE.BufferGeometry();
rg.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
rg.setAttribute('color', new THREE.BufferAttribute(rCol, 3));
// origin end dimmer than the head end, so 600 lines do not burn the centre white
for (i = 0; i < N*2; i++){ var rf = i % 2 ? 1 : 0.18; rCol[i*3] = COL_CHARGED[0]*rf; rCol[i*3+1] = COL_CHARGED[1]*rf; rCol[i*3+2] = COL_CHARGED[2]*rf; }
var rays = new THREE.LineSegments(rg, lineMat(0.35)); rays.frustumCulled = false; scene.add(rays);

// chart lines: baseline (2 halves), top line (2 halves), 21 ticks
var NSEG = 4 + 21;
var cPos = new Float32Array(NSEG*6), cCol = new Float32Array(NSEG*6);
for (i = 0; i < NSEG*2; i++){ cCol[i*3] = COL_BLUE[0]; cCol[i*3+1] = COL_BLUE[1]; cCol[i*3+2] = COL_BLUE[2]; }
var cg = new THREE.BufferGeometry();
cg.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
cg.setAttribute('color', new THREE.BufferAttribute(cCol, 3));
var chart = new THREE.LineSegments(cg, lineMat(0.45)); chart.frustumCulled = false; scene.add(chart);

// bell outlines
var NB = 96, bells = [];
[0,1].forEach(function(gp){
  var pos = new Float32Array(NB*3), col = new Float32Array(NB*3), c = gp === 0 ? COL_BLUE : COL_WARM;
  for (var k = 0; k < NB; k++){ col[k*3] = c[0]; col[k*3+1] = c[1]; col[k*3+2] = c[2]; }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  var l = new THREE.Line(g, lineMat(0.7)); l.frustumCulled = false; scene.add(l);
  bells.push(l);
});
var BELL_PEAK = (N/2) * PX / (SIGMA * Math.sqrt(2*Math.PI)); // expected dots in the middle column

// ---------------------------------------------------------------- render(t): pure function of t
var bgCol = new THREE.Color();
var sp = [0,0,0];
function setCol(j, c){ pCol[j*3] = c[0]; pCol[j*3+1] = c[1]; pCol[j*3+2] = c[2]; }
function mixCol(a, b, u, out){ out[0] = lerp(a[0],b[0],u); out[1] = lerp(a[1],b[1],u); out[2] = lerp(a[2],b[2],u); return out; }
var cc = [0,0,0], cc2 = [0,0,0];

function render(t){
  // camera
  var W = camW(t), fov = camFov(t), ang = camAngles(t);
  var dist = W / (Math.tan(fov/2*DEG) * ASPECT);
  camTarget(t, tmp);
  camera.fov = fov; camera.updateProjectionMatrix();
  camera.position.set(tmp[0] + dist*Math.sin(ang[0])*Math.cos(ang[1]),
                      tmp[1] + dist*Math.sin(ang[1]),
                      tmp[2] + dist*Math.cos(ang[0])*Math.cos(ang[1]));
  camera.lookAt(tmp[0], tmp[1], tmp[2]);
  pMat.uniforms.uRef.value = dist;
  pMat.uniforms.uDepth.value = t < 9.95 ? depthS(t) : 1 - eIO(seg(t, 9.95, 10.55));

  var hitT = t - 9.7;
  var hitB = hitT < 0 ? 1 : 1.4 + 0.8 * (hitT < 0.15 ? 1 : Math.exp(-(hitT - 0.15) / 0.09));
  var hitS = hitT < 0 ? 1 : 1 + 0.6 * (hitT < 0.15 ? 1 : Math.exp(-(hitT - 0.15) / 0.07));
  var chargeU = hitT < 0 ? 0 : clamp01(hitT / 0.15);
  var hlU = seg(t, 15.6, 16.6), hlA = Math.PI/2 + 2*Math.PI*eIO(hlU), hlEnv = Math.sin(Math.PI*hlU);

  for (var i = 0; i < N; i++){
    var s = S[i];
    starPos(i, t, sp);
    pPos[i*3] = sp[0]; pPos[i*3+1] = sp[1]; pPos[i*3+2] = sp[2];
    var tw = 1 + 0.12 * Math.sin(2*Math.PI*t/s.twP + s.twPh);
    var b, size = s.size, sq = 0;
    // visibility (steps 1-2)
    if (i === 0){
      var fl = 0.375 + 0.125 * (0.62*Math.sin(2*Math.PI*t/0.83) + 0.38*Math.sin(2*Math.PI*t/0.29 + 1.3));
      var weak = fl * eOut(seg(t, 0, 0.6));
      b = lerp(weak, s.bright * tw, eIO(seg(t, 1.5, 3.2)));
    } else {
      b = s.bright * tw * eIO(seg(t, s.fade, s.fade + 0.5));
    }
    // giving dip
    if (s.give !== undefined){
      var gd = seg(t, s.give, s.give + 0.3);
      if (gd > 0 && gd < 1) b *= 1 - 0.4 * Math.sin(Math.PI * gd);
    }
    // the hit
    b *= hitB; size *= hitS;
    var col = chargeU > 0 ? mixCol(COL_WARM, COL_CHARGED, chargeU, cc) : COL_WARM;
    // rain: flash + group colour, landing squash + column pulse
    if (t >= s.leave){
      var lt = t - s.leave;
      b *= 1 + 1.3 * Math.exp(-lt / 0.09);
      var gc = s.group === 0 ? COL_BLUE : COL_WARM;
      col = mixCol(COL_CHARGED, gc, clamp01(lt / 0.12), cc);
      if (t >= s.land){
        var ld = t - s.land;
        sq = 0.22 * Math.exp(-ld / 0.06);
        b *= 1 + 0.5 * Math.exp(-ld / 0.08);
        var pulse = 0;
        for (var q = 0; q < s.above.length; q++){
          var dt = t - s.above[q][0];
          if (dt >= 0 && dt < 0.6) pulse += 0.55 * Math.exp(-dt / 0.1) * Math.pow(0.88, s.above[q][1] - 1);
        }
        b *= 1 + pulse;
      }
    }
    // ring: colour back to warm, highlight sweep
    if (t >= s.ringT){
      var rv = eIO(seg(t, s.ringT, s.ringT + 1.1));
      col = mixCol(s.group === 0 ? COL_BLUE : COL_WARM, COL_WARM, rv, cc2);
      if (hlEnv > 0){
        var da = s.ringA + ringRot(t) - hlA;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        var hb = Math.exp(-da*da / (2*0.28*0.28)) * hlEnv;
        b *= 1 + 1.5 * hb; size *= 1 + 0.35 * hb;
      }
    }
    if (i === 0) size *= lerp(1.8, 1, eIO(seg(t, 1.5, 3.2)));
    pSize[i] = size; pBright[i] = b; pSq[i] = sq; setCol(i, col);
  }

  // sparks
  for (var g = 0; g < givers.length; g++){
    var te = S[givers[g]].give;
    starPos(givers[g], te, tmp2);
    for (var k = 0; k < 4; k++){
      var j = I_SPARK + g*4 + k, ts = t - k * 0.035;
      var u = (ts - te) / SPARK_DUR;
      if (u < 0 || u >= 1 || t >= te + SPARK_DUR){ pBright[j] = 0; pSize[j] = 0; continue; }
      var e = 1 - eIn(u);
      pPos[j*3] = tmp2[0]*e; pPos[j*3+1] = tmp2[1]*e; pPos[j*3+2] = tmp2[2]*e;
      pSize[j] = 6.5 * (1 - k*0.16);
      pBright[j] = (k === 0 ? 1.6 : 0.8 * (1 - k*0.25)) * eOut(seg(t, te, te + 0.06));
      setCol(j, COL_CHARGED); pSq[j] = 0;
    }
  }
  // centre glow
  var gb = 0, gp = 0;
  for (g = 0; g < givers.length; g++){
    var ta = S[givers[g]].give + SPARK_DUR;
    if (t >= ta){ gb += 0.1; gp += Math.exp(-(t - ta) / 0.14); }
  }
  var gsz = 44 * (1 + 0.18 * gp);
  gb += 0.12 * gp;
  var inh = eIn(seg(t, 8.8, 9.0));
  gsz *= lerp(1, 0.4, inh); gb *= lerp(1, 1.8, inh);
  if (t >= 9.0){
    var bf = seg(t, 9.0, 9.6);
    gsz = 44 * lerp(0.4, 1.5, eOut(bf));
    gb = 1.8 * (1 - bf) * (1 - bf);
  }
  pPos[I_GLOW*3] = 0; pPos[I_GLOW*3+1] = 0; pPos[I_GLOW*3+2] = 0;
  pSize[I_GLOW] = gsz; pBright[I_GLOW] = gb; setCol(I_GLOW, COL_CHARGED); pSq[I_GLOW] = 0;

  // rays + heads
  var rayOn = t >= 9.0 && t < 9.9;
  var ru = eOutQuad(seg(t, 9.0, 9.7));
  var headB = (t >= 9.0 && t < 9.7) ? eOut(seg(t, 9.0, 9.05)) : 0;
  rays.visible = rayOn;
  rays.material.opacity = 0.35 * (1 - seg(t, 9.6, 9.9));
  for (i = 0; i < N; i++){
    var hj = I_HEAD + i;
    var hx = pPos[i*3]*ru, hy = pPos[i*3+1]*ru, hz = pPos[i*3+2]*ru;
    pPos[hj*3] = hx; pPos[hj*3+1] = hy; pPos[hj*3+2] = hz;
    pSize[hj] = 7; pBright[hj] = headB; setCol(hj, COL_CHARGED); pSq[hj] = 0;
    if (rayOn){ rPos[i*6] = 0; rPos[i*6+1] = 0; rPos[i*6+2] = 0; rPos[i*6+3] = hx; rPos[i*6+4] = hy; rPos[i*6+5] = hz; }
  }
  rg.attributes.position.needsUpdate = true;

  // chart lines
  var cp = eIO(seg(t, 9.95, 10.55));
  chart.visible = t >= 9.95 && t < 14.5;
  chart.material.opacity = 0.45 * (1 - seg(t, 14.0, 14.5));
  var half = 0.84 * cp;
  var L = [
    [0, Y_BASE, -half, Y_BASE], [0, Y_BASE, half, Y_BASE],
    [0, Y_TOP, -half, Y_TOP], [0, Y_TOP, half, Y_TOP]
  ];
  for (k = 0; k < 4; k++){
    cPos[k*6] = sx(L[k][0]); cPos[k*6+1] = L[k][1]; cPos[k*6+2] = 0;
    cPos[k*6+3] = sx(L[k][2]); cPos[k*6+4] = L[k][3]; cPos[k*6+5] = 0;
  }
  for (k = 0; k < 21; k++){
    var tx = -0.84 + 1.68 * k / 20, tl = clamp01((half - Math.abs(tx)) / 0.06) * 0.012 * H_W;
    var o2 = (4 + k) * 6;
    cPos[o2] = sx(tx); cPos[o2+1] = Y_BASE; cPos[o2+2] = 0;
    cPos[o2+3] = sx(tx); cPos[o2+4] = Y_BASE - tl; cPos[o2+5] = 0;
  }
  cg.attributes.position.needsUpdate = true;

  // bell outlines
  var bp = eIO(seg(t, 13.3, 13.9));
  bells.forEach(function(l, gp){
    l.visible = t >= 13.3 && t < 14.5;
    l.material.opacity = 0.7 * (1 - seg(t, 14.0, 14.5));
    var pos = l.geometry.attributes.position.array, c = CENTRES[gp];
    var x0 = c - 3.2*SIGMA, x1 = lerp(x0, c + 3.2*SIGMA, bp);
    for (var k = 0; k < NB; k++){
      var x = lerp(x0, x1, k / (NB-1)), z = (x - c) / SIGMA;
      pos[k*3] = sx(x);
      pos[k*3+1] = Y_BASE + (BELL_PEAK * Math.exp(-z*z/2) + 1.1) * PITCH;
      pos[k*3+2] = 0;
    }
    l.geometry.attributes.position.needsUpdate = true;
  });

  pg.attributes.position.needsUpdate = true;
  pg.attributes.aSize.needsUpdate = true;
  pg.attributes.aBright.needsUpdate = true;
  pg.attributes.aColor.needsUpdate = true;
  pg.attributes.aSquash.needsUpdate = true;

  // background flash at the hit
  var fl2 = hitT >= 0 && hitT < 0.1 ? 0.05 * (1 - hitT / 0.1) : 0;
  bgCol.setRGB(lerp(BG[0], 1, fl2), lerp(BG[1], 1, fl2), lerp(BG[2], 1, fl2));
  renderer.setClearColor(bgCol, 1);

  word.style.opacity = eOut(seg(t, 16.8, 17.5)).toFixed(3);
  renderer.render(scene, camera);
}

// ---------------------------------------------------------------- sizing
function resize(){
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  pMat.uniforms.uScale.value = (w / 390) * renderer.getPixelRatio();
  word.style.fontSize = (w * 0.09).toFixed(1) + 'px';
  render(cur);
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- playback + controls
var cur = 0, playing = false, t0wall = 0, raf = 0, resumeOnShow = false;
var playBtn = document.getElementById('play'), playIcon = document.getElementById('playIcon'),
    scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'),
    stepEl = document.getElementById('step'), again = document.getElementById('again');

function ui(){
  scrub.value = cur.toFixed(2);
  timeEl.textContent = cur.toFixed(1) + ' s';
  var name = STEPS[0][1];
  for (var k = 0; k < STEPS.length; k++) if (cur >= STEPS[k][0]) name = STEPS[k][1];
  stepEl.textContent = name;
  playIcon.setAttribute('d', playing ? 'M2 1h3v10H2zM7 1h3v10H7z' : 'M2 1l9 5-9 5z');
  playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Abspielen');
  again.hidden = cur < T_END;
}
function frame(now){
  if (!playing) return;
  cur = Math.min(T_END, (now - t0wall) / 1000);
  render(cur);
  if (cur >= T_END) playing = false;
  ui();
  if (playing) raf = requestAnimationFrame(frame);
}
function play(from){
  if (from !== undefined) cur = from;
  if (cur >= T_END) cur = 0;
  playing = true;
  t0wall = performance.now() - cur * 1000;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(frame);
  ui();
}
function pause(){ playing = false; cancelAnimationFrame(raf); ui(); }
function seek(t){
  cur = Math.max(0, Math.min(T_END, +t || 0));
  if (playing) t0wall = performance.now() - cur * 1000;
  render(cur); ui();
}
window.seek = seek;
window.__cloud = { camera: camera, pos: pPos, bright: pBright };

playBtn.addEventListener('click', function(){ playing ? pause() : play(); });
again.addEventListener('click', function(){ play(0); });
stage.addEventListener('click', function(){ play(0); });
scrub.addEventListener('input', function(){ if (playing) pause(); seek(parseFloat(scrub.value)); });
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ resumeOnShow = playing; if (playing) pause(); }
  else if (resumeOnShow){ resumeOnShow = false; play(); }
});

// start
var qt = new URLSearchParams(location.search).get('t');
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
resize();
if (qt !== null && !isNaN(parseFloat(qt))) seek(parseFloat(qt));
else if (reduce) seek(T_END);
else play(0);
})();
</script>
