<title>The Cloud</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --page:#EEF0F4; --ink:#1A2233; --muted:#5B6578; --accent:#A8731A;
  --btn:#FFFFFF; --btnline:#D3D8E2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#05070D; --ink:#E6E9F0; --muted:#8C95A8; --accent:#FFD27A;
    --btn:#121826; --btnline:#263045;
  }
}
:root[data-theme="dark"]{
  --page:#05070D; --ink:#E6E9F0; --muted:#8C95A8; --accent:#FFD27A;
  --btn:#121826; --btnline:#263045;
}
html,body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;}
body{overflow-x:hidden}
.wrap{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  padding:12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));}
.col{width:min(430px, 100%, calc((100vh - 96px) * 390 / 844));}
@supports (height:100dvh){ .col{width:min(430px, 100%, calc((100dvh - 96px) * 390 / 844));} }
.stage{position:relative;width:100%;aspect-ratio:390/844;border-radius:28px;overflow:hidden;background:#0B1120;
  cursor:pointer;-webkit-tap-highlight-color:transparent;}
.stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.word{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);color:#FFF1C9;font-weight:700;
  letter-spacing:.03em;opacity:0;pointer-events:none;white-space:nowrap;line-height:1;font-size:35px}
.bar{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px}
.bar input{flex:1;min-width:0;margin:0;accent-color:var(--accent)}
.btn{font:inherit;font-size:12px;color:var(--ink);background:var(--btn);border:1px solid var(--btnline);
  border-radius:999px;height:28px;padding:0 12px;cursor:pointer;white-space:nowrap}
.btn.icon{width:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.time{font-variant-numeric:tabular-nums;min-width:38px;text-align:right;color:var(--muted)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);min-height:28px}
.again[hidden]{display:none}
</style>

<div class="wrap">
  <div class="col">
    <div class="stage" id="stage" aria-label="Intro-Animation, tippen startet neu">
      <div class="word" id="word">MEjority</div>
    </div>
    <div class="bar">
      <button class="btn icon" id="play" aria-label="Abspielen">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path id="playIcon" fill="currentColor" d="M2 1l9 5-9 5z"/></svg>
      </button>
      <input type="range" id="scrub" min="0" max="13.8" step="0.01" value="0" aria-label="Zeit">
      <span class="time" id="time">0.0 s</span>
    </div>
    <div class="row2">
      <span id="step">Ein Stern</span>
      <button class="btn again" id="again" hidden>Noch mal</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
// ---------------------------------------------------------------- constants
var T_END = 13.8;   // recomputed from R0 below
var N = 600;
var R = 10;
var ASPECT = 390 / 844;
var DEG = Math.PI / 180;
var OMEGA_OUT = 2 * Math.PI / 22;
var TILT = 62 * DEG;          // main plane: normal 62 deg away from the line of sight
var W0 = 0.45;                // visible half-width (world) at t = 0: the hero alone
var W_END = 11.5;             // visible half-width from 6.0 s on: cloud + small margin
var H_W = 2 * W_END / ASPECT; // stage height in world units in chart space

var COL_WARM = hex('#FFD27A'), COL_CHARGED = hex('#FFF1C9'),
    COL_BLUE = hex('#8FA3C4');
var BG = hex('#0B1120');

var STEPS = [
  [0.0,'Ein Stern'],[1.5,'Mehr und mehr'],[2.9,'Einige geben'],[4.0,'Das Zentrum w\u00e4chst'],
  [5.0,'Das Zentrum antwortet'],[6.3,'Alle leuchten']
];  // the later steps are appended once the rain / ring times are known (see T_FALL0, R0)

function hex(h){ var n = parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; }
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
function seg(t,a,b){ return clamp01((t-a)/(b-a)); }
function lerp(a,b,u){ return a + (b-a)*u; }
function eIn(x){ return x*x*x; }
function eOut(x){ var y = 1-x; return 1 - y*y*y; }
function eIO(x){ return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; }
function eInQuart(x){ return x*x*x*x; }
function ss(x){ x = clamp01(x); return x*x*x*(x*(6*x - 15) + 10); }   // smootherstep
function ssI(x){ x = clamp01(x); return x*x*x*x*(x*(x - 3) + 2.5); } // integral of ss over 0..x

// seeded random (mulberry32)
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rand = rng(20261119);
function gauss(){ var u = Math.max(1e-9, rand()), v = rand(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }

// ---------------------------------------------------------------- stars
var S = [];
for (var i = 0; i < N; i++){
  var r = Math.max(1.5, R * Math.sqrt(rand()));
  if (i === 0) r = 6;
  var node = rand() * 2 * Math.PI, inc = (rand()*2 - 1) * 35 * DEG;
  if (i === 0) inc = 6 * DEG;
  var ux = Math.cos(node), uy = Math.sin(node);
  // v = in-plane perpendicular, tilted about u by inc
  var vx = -Math.sin(node) * Math.cos(inc), vy = Math.cos(node) * Math.cos(inc), vz = Math.sin(inc);
  S.push({
    r: r, ux: ux, uy: uy, vx: vx, vy: vy, vz: vz,
    ph: rand() * 2 * Math.PI,
    om: OMEGA_OUT * Math.pow(R / r, 0.5),
    size: 11 * (1 + (rand()*2 - 1) * 0.4),
    bright: i === 0 ? 0.85 : 0.6 + rand() * 0.3,
    twP: 1.5 + rand() * 1.5, twPh: rand() * 2 * Math.PI
  });
}

// orbit angle = integral of the spin rate; rate: 0 -> 1 (smootherstep 2.8..5.6: the turn is complete before the
// giving), 1 -> 0 (smootherstep 7.2..8.9, while the stars already rise: they spiral upward, the last turn dies as
// the last stars reach the line). SPIN_DIR: the cloud's own turn matches the apparent turn from the camera moving right.
var SPIN_DIR = -1, SPIN_T1 = 7.2, SPIN_T2 = 8.9, SP0 = 2.8, SP1 = 5.6;
function spinA(t){
  var U = SP1 - SP0, D = SPIN_T2 - SPIN_T1;
  var up = t <= SP0 ? 0 : t < SP1 ? U * ssI((t - SP0) / U) : U / 2 + (t - SP1);
  var dn = t <= SPIN_T1 ? 0 : t < SPIN_T2 ? D * ssI((t - SPIN_T1) / D) : D / 2 + (t - SPIN_T2);
  return SPIN_DIR * (up - dn);
}
// depth of the cloud along the view axis: flat until 2.8, full by 5.3
function depthS(t){ return eIO(seg(t, 2.8, 5.3)); }

var cT = Math.cos(TILT), sT = Math.sin(TILT);
function cloudPos(i, A, dz, out){
  var s = S[i], th = s.ph + s.om * A, c = Math.cos(th), sn = Math.sin(th);
  var x = s.r * (s.ux*c + s.vx*sn), y = s.r * (s.uy*c + s.vy*sn), z = s.r * (s.vz*sn);
  // rotate the face-on disc about X so its top leans away: normal = (0, sin62, cos62)
  out[0] = x;
  out[1] = y * cT + z * sT;
  out[2] = (-y * sT + z * cT) * dz;
  return out;
}

// ---------------------------------------------------------------- camera
// W(t): one eased curve in log space, 0.6 .. 6.0
function camW(t){ return W0 * Math.pow(W_END / W0, eIO(seg(t, 0.6, 6.0))); }
// the switch: one smootherstep over 6.65..8.2 for angles, fov and depth
var SW_T1 = 6.65, SW_T2 = 8.2;
function swU(t){ return ss(seg(t, SW_T1, SW_T2)); }
function camFov(t){
  if (t < SW_T1) return 8 + 34 * eIO(seg(t, 2.8, 5.3));
  return 42 - 36 * swU(t);
}
function camAngles(t){
  var d = ss(seg(t, 2.6, 6.0)), b = swU(t);
  return [28 * DEG * d * (1-b), 8 * DEG * d * (1-b)];
}
function camDepth(t){ return t < SW_T1 ? depthS(t) : 1 - swU(t); }
var tmp = [0,0,0], tmp2 = [0,0,0];
function camTarget(t, out){
  cloudPos(0, spinA(t), depthS(t), out);
  var u = eIO(seg(t, 1.5, 4.5));
  out[0] *= 1-u; out[1] *= 1-u; out[2] *= 1-u;
  return out;
}

// ---------------------------------------------------------------- fade-in schedule (step 2)
var WTAB = []; for (var k = 0; k <= 600; k++) WTAB.push(camW(k * 0.01));
function camWinv(w){ for (var k = 0; k <= 600; k++) if (WTAB[k] >= w) return k * 0.01; return 6; }
var hero0 = cloudPos(0, 0, 0, [0,0,0]), p0 = [0,0,0], dmax = 0;
for (i = 0; i < N; i++){ cloudPos(i, 0, 0, p0); S[i].dh = Math.hypot(p0[0]-hero0[0], (p0[1]-hero0[1]) * ASPECT * 1.6); dmax = Math.max(dmax, S[i].dh); }
for (i = 1; i < N; i++){
  // first the hero's neighbours as the frame widens, then a wave running outward from the hero; all lit by 4.5
  var st = Math.min(camWinv(S[i].dh * 1.15), 2.5 + 1.4 * S[i].dh / dmax) + rand() * 0.12;
  S[i].fade = Math.max(1.2, Math.min(4.0, st));   // the hero is alone a little longer
}

// ---------------------------------------------------------------- givers (step 4)
var GIVE_GAP = 0.88 / 7, GIVE_T0 = 2.9, SPARK_DUR = 0.7;
var givers = [0], givers0 = [0];
var HERO_B = 1.15 * (function(){ var m = 0; for (var j = 1; j < N; j++) m = Math.max(m, S[j].bright); return m; })();
// camera at time t (shared by render and the giver check)
function setCam(t, cam){
  var W = camW(t), fov = camFov(t), ang = camAngles(t);
  var dist = W / (Math.tan(fov/2*DEG) * ASPECT);
  camTarget(t, tmp);
  cam.fov = fov; cam.updateProjectionMatrix();
  cam.position.set(tmp[0] + dist*Math.sin(ang[0])*Math.cos(ang[1]),
                   tmp[1] + dist*Math.sin(ang[1]),
                   tmp[2] + dist*Math.cos(ang[0])*Math.cos(ang[1]));
  cam.lookAt(tmp[0], tmp[1], tmp[2]);
  cam.updateMatrixWorld(); cam.matrixWorldInverse.copy(cam.matrixWorld).invert();
  return dist;
}
var chkCam = new THREE.PerspectiveCamera(8, ASPECT, 0.05, 5000), chkV = new THREE.Vector3();
function onScreen(j, t, lim){   // live cloud position at t (stars orbit until the rise)
  cloudPos(j, spinA(t), depthS(t), p0);
  setCam(t, chkCam);
  chkV.set(p0[0], p0[1], p0[2]).project(chkCam);
  return chkV.z < 1 && Math.abs(chkV.x) <= lim && Math.abs(chkV.y) <= lim;
}
(function(){
  var sectors = [0,1,2,3,4,5,6,7];
  for (var a = 7; a > 0; a--){ var b = Math.floor(rand()*(a+1)), tt = sectors[a]; sectors[a] = sectors[b]; sectors[b] = tt; }
  var heroAng = Math.atan2(hero0[1], hero0[0]);
  sectors.forEach(function(sec){
    var cand = [];
    for (var j = 1; j < N; j++){
      if (S[j].r < 4 || S[j].r > 9.5) continue;
      cloudPos(j, 0, 1, p0);
      var ang = Math.atan2(p0[1], p0[0]) - heroAng;
      ang = ((ang % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
      if (Math.floor(ang / (Math.PI/4)) === sec && (sec !== 0 || ang > 0.3)) cand.push(j);
    }
    // same random draw as before; if that star is not lit or not inside the frame (5 % margin) at its give time,
    // take the next candidate of the sector that is (deterministic)
    var k0 = Math.floor(rand() * cand.length), tg = GIVE_T0 + givers.length * GIVE_GAP, pick = cand[k0];
    givers0.push(pick);
    givers.push(pick);   // the list stays as approved (0, 144, 67, 351, 301, 273, 344, 322, 107); no fallback
  });
})();
givers = givers.slice(1);   // the first star (hero) does not give; the eight others keep their order and span
givers.forEach(function(g, k){ S[g].give = GIVE_T0 + k * GIVE_GAP; });
// a giver is fully lit 0.3 s before it gives (its ray starts 0.15 s before): move only its fade-in earlier,
// same 0.5 s duration, never before 1.2 s (the hero stays alone until then)
var fadeMoved = [];
givers.forEach(function(g){
  if (g === 0) return;
  var latest = S[g].give - 0.3 - 0.5;
  if (S[g].fade > latest){ var nf = Math.max(1.2, latest); fadeMoved.push([g, +(S[g].fade - nf).toFixed(3)]); S[g].fade = nf; }
});

// ---------------------------------------------------------------- resting cloud (orbit angle after the spin has stopped) + chart slots
var A_F = spinA(SPIN_T2);
var PF = []; for (i = 0; i < N; i++) PF.push(cloudPos(i, A_F, 1, [0,0,0]));
function sx(x){ return x * W_END; }            // stage x (-1..1) -> world
function sy(f){ return (0.5 - f) * H_W; }      // stage y (fraction from top) -> world
var Y_TOP = sy(0.14), Y_BASE = sy(0.78);
var PITCH = 2 * W_END / 68;                     // dot diameter in world units
var LEAVE_SPREAD = 0.5;   // short: with arrivals spread over 0.7 s, at most ~270 stars sit on the line at once
var RISE_T0 = 6.65, RISE_STAG = 0.7, RISE_DUR = 1.1;
function sstep(x){ x = clamp01(x); return x*x*(3 - 2*x); }   // smoothstep: the rise picks up sooner

(function(){
  var ord = []; for (var j = 0; j < N; j++) ord.push(j);
  ord.sort(function(a,b){ return PF[a][0] - PF[b][0]; });
  ord.forEach(function(j, k){ S[j].slotX = sx(-0.84 + 1.68 * (k + 0.5) / N); });
  // upper stars first, by rank (heights cluster in the middle; a linear height stagger would bunch the arrivals)
  var byY = []; for (j = 0; j < N; j++) byY.push(j);
  byY.sort(function(a,b){ return PF[b][1] - PF[a][1]; });
  byY.forEach(function(j, k){ S[j].rise = RISE_T0 + RISE_STAG * (k + 0.5) / N; });
})();

// rain + heaps
var SIGMA = 0.11, CENTRES = [-0.22, 0.22], PX = 2/68;
(function(){
  var ord = []; for (var j = 0; j < N; j++) ord.push(j);
  for (var a = N-1; a > 0; a--){ var b = Math.floor(rand()*(a+1)), tt = ord[a]; ord[a] = ord[b]; ord[b] = tt; }
  var cols = {};
  ord.forEach(function(j, k){
    var s = S[j];
    s.group = k < N/2 ? 0 : 1;
    s.leave = s.rise + RISE_DUR + 0.05 + rand() * LEAVE_SPREAD;   // falls soon after its own arrival: no standing line
    s.fall = 0.55 + rand() * 0.35;
    s.land = s.leave + s.fall;
    var z = Math.max(-3, Math.min(3, gauss()));
    var kc = Math.round(z * SIGMA / PX);
    s.col = kc;
    s.colX = sx(CENTRES[s.group] + kc * PX);
    var key = s.group + ':' + kc;
    (cols[key] = cols[key] || []).push(j);
  });
  Object.keys(cols).forEach(function(key){
    var list = cols[key];
    list.sort(function(a,b){ return S[a].land - S[b].land; });
    list.forEach(function(j, h){
      S[j].h = h;
      S[j].landY = Y_BASE + (h + 0.6) * PITCH;
      S[j].above = list.slice(h+1).map(function(q, k){ return [S[q].land, k + 1]; }); // = S[q].h - h (S[q].h is not set yet here)
    });
  });
  for (j = 0; j < N; j++){ var s = S[j]; s.g = 2 * (Y_TOP - s.landY) / (s.fall * s.fall); }
})();
var T_FALL0 = 1e9, T_LAND = 0;
for (i = 0; i < N; i++){ T_FALL0 = Math.min(T_FALL0, S[i].leave); T_LAND = Math.max(T_LAND, S[i].land); }
var BELL_T1 = T_FALL0 + 0.5, BELL_T2 = T_LAND - 0.1;    // outlines grow out of the baseline while the stars fall
var R0_OLD = T_LAND - 0.25;                             // ring start until round 7; bells and chart still fade from here
var R0 = 9.2;                                           // ring start: the heaps begin to flow while the last stars still fall
var R1 = R0 + 1.0;                                      // breathing of the ring radius
T_END = R0 + (Math.ceil((R0_OLD + 4.2) * 10 - 1e-9) / 10 - R0_OLD);   // same distance to the ring start as before
STEPS.push([RISE_T0,'Aufsteigen'], [Math.round(T_FALL0*10)/10,'Regen, zwei Glocken'],
           [Math.round(R0*10)/10,'Der Kreis'], [Math.round((R0+3.0)*10)/10,'MEjority']);

// ring
var RING_C = sy(0.44), RING_R = 0.3 * 2 * W_END;
var RING_W = 2 * Math.PI / 14, RING_MIN_SWEEP = 40 * DEG, RING_LEAD = 0.55;   // radius reaches the ring within the first 55 % of the travel
function travOf(sw){ return 0.85 + 0.75 * sw / (350 * DEG); }                  // travel time grows with the sweep
// ring rotation, counter-clockwise on screen: eases in from R0 over 1.0 s, then turns at RING_W
function ringRot(t){
  if (t <= R0) return 0;
  if (t <= R0 + 1.0) return RING_W * (t-R0)*(t-R0) / 2;
  return RING_W * (t - R0 - 0.5);
}
// one swirl: departures in landing order (heaps empty from the bottom); ring slots in the order of each star's
// angle around the ring centre, so no two paths cross; every star turns counter-clockwise by 40 deg or more
var SWEEP = { min: 0, max: 0 };
(function(){
  var byLand = []; for (var j = 0; j < N; j++) byLand.push(j);
  byLand.sort(function(a,b){ return S[a].land - S[b].land; });
  byLand.forEach(function(j, k){ S[j].ringT = Math.max(R0 + 0.9 * k / (N - 1), S[j].land + 0.1); });
  var ang = []; for (j = 0; j < N; j++){ var s = S[j]; s.r0 = Math.hypot(s.colX, s.landY - RING_C); s.th0 = Math.atan2(s.landY - RING_C, s.colX); ang.push(j); }
  ang.sort(function(a,b){ return S[a].th0 - S[b].th0 || S[a].r0 - S[b].r0; });
  // cut the circle in the largest empty gap of the start angles
  var gapAt = 0, gap = S[ang[0]].th0 + 2*Math.PI - S[ang[N-1]].th0;
  for (var k = 1; k < N; k++){ var g2 = S[ang[k]].th0 - S[ang[k-1]].th0; if (g2 > gap){ gap = g2; gapAt = k; } }
  var ord = ang.slice(gapAt).concat(ang.slice(0, gapAt));
  ord.forEach(function(j, k){ if (k > 0 && S[j].th0 < S[ord[k-1]].th0) S[j].th0 += 2*Math.PI; });   // unwrap ascending
  // offset so the smallest sweep (to the slot including the ring rotation at arrival) is 40 deg, then nudged by
  // less than one slot so the final ring dots sit where they sat before (base: pi/2 + pi/N + k*2pi/N, turned by the old rotation)
  var step = 2*Math.PI / N;
  var dOld = T_END - R0;                                       // final frame, same distance to R0 as before
  var rotOldEnd = RING_W * (dOld - 1.0 - 0.25), rotNewEnd = ringRot(T_END);
  var want = Math.PI/2 + Math.PI/N + rotOldEnd - rotNewEnd;     // lattice the final dots must sit on
  ord.forEach(function(j){ S[j].trav = 1.1; });
  for (var it = 0; it < 4; it++){                              // sweep and travel time depend on each other: settle them
    var lo = 1e9;
    ord.forEach(function(j, k){ lo = Math.min(lo, k*step + ringRot(S[j].ringT + S[j].trav) - S[j].th0); });
    var off = RING_MIN_SWEEP - lo;
    off += (((want - off) % step) + step) % step;
    SWEEP.min = 1e9; SWEEP.max = -1e9;
    ord.forEach(function(j, k){
      var s = S[j]; s.ringA = off + k*step;
      var sw = s.ringA + ringRot(s.ringT + s.trav) - s.th0;
      if (it < 3) s.trav = travOf(sw);
      SWEEP.min = Math.min(SWEEP.min, sw); SWEEP.max = Math.max(SWEEP.max, sw);
    });
  }
})();
// the centre answers, per star (drawn after all other random numbers, so nothing else changes):
// ray fades in at rayOn, the signal leaves at dep and arrives at arr, the star glows up from arr, the ray fades from arr
for (i = 0; i < N; i++){
  var sI = S[i];
  sI.rayOn = 4.95 + 0.3 * (sI.r / R) + 0.2 * rand();
  sI.dep = 5.5 + 0.3 * rand();
  sI.arr = sI.dep + 0.75 + 0.15 * rand();
}
function ringRad(t){ return RING_R * (1 + 0.015 * Math.sin(2*Math.PI*(t-R1)/3.6) * eIO(seg(t,R1,R1+0.8))); }

// ---------------------------------------------------------------- star position / look
function starPos(i, t, out){
  var s = S[i];
  if (t < s.rise) return cloudPos(i, spinA(t), depthS(t), out);
  if (t < s.ringT){
    if (t < s.rise + RISE_DUR){
      // blend from the live, still turning orbit to the slot: leaves without a kink, settles without a bounce
      var e = sstep((t - s.rise) / RISE_DUR);
      cloudPos(i, spinA(t), depthS(t), out);
      out[0] = lerp(out[0], s.slotX, e); out[1] = lerp(out[1], Y_TOP, e); out[2] = lerp(out[2], 0, e);
      return out;
    }
    if (t < s.leave){
      out[0] = s.slotX; out[1] = Y_TOP; out[2] = 0;
      return out;
    }
    if (t < s.land){
      var tau = t - s.leave;
      out[0] = lerp(s.slotX, s.colX, eIO(tau / s.fall));
      out[1] = Y_TOP - 0.5 * s.g * tau * tau; out[2] = 0;

      var x = lerp(x0, x1, k / (NB-1)), z = (x - c) / SIGMA;
      pos[k*3] = sx(x);
      pos[k*3+1] = Y_BASE + bh * (BELL_PEAK * Math.exp(-z*z/2) + 1.1) * PITCH;
      pos[k*3+2] = 0;
    }
    l.geometry.attributes.position.needsUpdate = true;
  });

  pg.attributes.position.needsUpdate = true;
  pg.attributes.aSize.needsUpdate = true;
  pg.attributes.aBright.needsUpdate = true;
  pg.attributes.aColor.needsUpdate = true;
  pg.attributes.aSquash.needsUpdate = true;
  pg.attributes.aSharp.needsUpdate = true;

  bgCol.setRGB(BG[0], BG[1], BG[2]);
  renderer.setClearColor(bgCol, 1);

  word.style.opacity = eOut(seg(t, R0 + 3.0, R0 + 3.7)).toFixed(3);
  renderer.render(scene, camera);
}

// ---------------------------------------------------------------- sizing
function resize(){
  var w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  pMat.uniforms.uScale.value = (w / 390) * renderer.getPixelRatio();
  word.style.fontSize = (w * 0.09).toFixed(1) + 'px';
  render(cur);
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- playback + controls
var cur = 0, playing = false, t0wall = 0, raf = 0, resumeOnShow = false;
var playBtn = document.getElementById('play'), playIcon = document.getElementById('playIcon'),
    scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'),
    stepEl = document.getElementById('step'), again = document.getElementById('again');
scrub.max = String(T_END);

function ui(){
  scrub.value = cur.toFixed(2);
  timeEl.textContent = cur.toFixed(1) + ' s';
  var name = STEPS[0][1];
  for (var k = 0; k < STEPS.length; k++) if (cur >= STEPS[k][0]) name = STEPS[k][1];
  stepEl.textContent = name;
  playIcon.setAttribute('d', playing ? 'M2 1h3v10H2zM7 1h3v10H7z' : 'M2 1l9 5-9 5z');
  playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Abspielen');
  again.hidden = cur < T_END;
}
function frame(now){
  if (!playing) return;
  cur = Math.min(T_END, (now - t0wall) / 1000);
  render(cur);
  if (cur >= T_END) playing = false;
  ui();
  if (playing) raf = requestAnimationFrame(frame);
}
function play(from){
  if (from !== undefined) cur = from;
  if (cur >= T_END) cur = 0;
  playing = true;
  t0wall = performance.now() - cur * 1000;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(frame);
  ui();
}
function pause(){ playing = false; cancelAnimationFrame(raf); ui(); }
function seek(t){
  cur = Math.max(0, Math.min(T_END, +t || 0));
  if (playing) t0wall = performance.now() - cur * 1000;
  render(cur); ui();
}
window.seek = seek;
window.__cloud = { camera: camera, pos: pPos, bright: pBright, S: S,
  times: { T_FALL0: T_FALL0, T_LAND: T_LAND, R0: R0, R0_OLD: R0_OLD, T_END: T_END, SWEEP_MIN: SWEEP.min / DEG, SWEEP_MAX: SWEEP.max / DEG, RING_LEAD: RING_LEAD, RING_C: RING_C, RING_R: RING_R, BELL_T1: BELL_T1, BELL_T2: BELL_T2, RISE_DUR: RISE_DUR }, STEPS: STEPS, givers: givers, givers0: givers0, fadeMoved: fadeMoved,
  size: pSize, idx: { I_GLOW: I_GLOW, I_MINI: I_MINI, I_CHALO: I_CHALO, PK: PK, NG: NG } };

playBtn.addEventListener('click', function(){ playing ? pause() : play(); });
again.addEventListener('click', function(){ play(0); });
stage.addEventListener('click', function(){ play(0); });
scrub.addEventListener('input', function(){ if (playing) pause(); seek(parseFloat(scrub.value)); });
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ resumeOnShow = playing; if (playing) pause(); }
  else if (resumeOnShow){ resumeOnShow = false; play(); }
});

// start
var qt = new URLSearchParams(location.search).get('t');
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
resize();
if (qt !== null && !isNaN(parseFloat(qt))) seek(parseFloat(qt));
else if (reduce) seek(T_END);
else play(0);
})();
</script>
